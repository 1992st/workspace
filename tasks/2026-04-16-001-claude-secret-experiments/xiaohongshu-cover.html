<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小红书配图 - Claude BUDDY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  position: relative;
  overflow: hidden;
}

/* 背景装饰 */
.bg-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.15;
}
.circle1 { width: 400px; height: 400px; background: #fff; top: -100px; right: -100px; }
.circle2 { width: 300px; height: 300px; background: #ffecd2; bottom: -50px; left: -50px; }
.circle3 { width: 200px; height: 200px; background: #fcb69f; top: 40%; left: 20%; }

/* 主容器 */
.container {
  position: relative;
  z-index: 10;
  padding: 60px 50px;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* 标题区 */
.header {
  text-align: center;
  margin-bottom: 40px;
}

.tag {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  color: #fff;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
}

.main-title {
  font-size: 72px;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  text-shadow: 0 4px 20px rgba(0,0,0,0.2);
  margin-bottom: 15px;
}

.subtitle {
  font-size: 36px;
  color: rgba(255,255,255,0.9);
  font-weight: 500;
}

/* 内容卡片 */
.card {
  background: rgba(255,255,255,0.95);
  border-radius: 30px;
  padding: 40px;
  margin: 20px 0;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.card-title {
  font-size: 40px;
  font-weight: 700;
  color: #764ba2;
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.card-content {
  font-size: 32px;
  color: #444;
  line-height: 1.6;
}

.highlight {
  background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
}

/* 特性列表 */
.features {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}

.feature-item {
  flex: 1;
  background: rgba(118,75,162,0.1);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
}

.feature-icon {
  font-size: 48px;
  margin-bottom: 15px;
}

.feature-title {
  font-size: 28px;
  font-weight: 700;
  color: #764ba2;
  margin-bottom: 10px;
}

.feature-desc {
  font-size: 22px;
  color: #666;
}

/* 底部 */
.footer {
  margin-top: auto;
  text-align: center;
  padding-top: 30px;
}

.cta {
  display: inline-block;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 20px 50px;
  border-radius: 50px;
  font-size: 32px;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(102,126,234,0.4);
}

.account {
  margin-top: 25px;
  font-size: 26px;
  color: rgba(255,255,255,0.8);
}

.emoji-big {
  font-size: 56px;
}
</style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>
  <div class="bg-circle circle3"></div>

  <div class="container">
    <!-- 标题区 -->
    <div class="header">
      <div class="tag">🔥 科技前沿</div>
      <div class="main-title">震惊！<br>Claude 偷偷变成了<br>电子宠物 🐣</div>
      <div class="subtitle">从 46 万行源码挖出的隐藏彩蛋</div>
    </div>

    <!-- 核心内容 -->
    <div class="card">
      <div class="card-title">
        <span class="emoji-big">🐥</span>
        <span>BUDDY 是什么？</span>
      </div>
      <div class="card-content">
        Claude Code 内置的<span class="highlight">养成系电子宠物</span><br>
        它会记得你的喜好、陪你成长<br>
        甚至有自己的<span class="highlight">心情指数</span> 💕
      </div>
      
      <div class="features">
        <div class="feature-item">
          <div class="feature-icon">🦴</div>
          <div class="feature-title">骨骼</div>
          <div class="feature-desc">外观形态<br>本地生成</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">✨</div>
          <div class="feature-title">灵魂</div>
          <div class="feature-desc">性格记忆<br>永久保留</div>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      <div class="cta">👆 关注看完整解析</div>
      <div class="account">@Agent观察室 · AI 前沿追踪</div>
    </div>
  </div>
</body>
</html>
