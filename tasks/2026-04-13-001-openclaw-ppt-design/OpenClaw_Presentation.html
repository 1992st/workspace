<script>
const total = 10;
let current = 1;
let animationStack = []; // 记录从哪一页跳转来的
const iframe = document.getElementById('slide-frame');
function loadSlide(n) {
  const html = document.getElementById('s' + n).value;
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  document.getElementById('page-num').textContent = n + ' / ' + total;
}
function next() { if (current < total) { current++; loadSlide(current); } }
function prev() { if (current > 1) { current--; loadSlide(current); } }
function goToSlide(n) {
  if (n >= 1 && n <= total) {
    animationStack.push(current); // 记录来源页
    current = n;
    loadSlide(current);
  }
}
function goBack() {
  if (animationStack.length > 0) {
    current = animationStack.pop();
    loadSlide(current);
  } else if (current > 1) {
    current--;
    loadSlide(current);
  }
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
}

// 监听 iframe 内发送的 postMessage（返回按钮和动画跳转用）
window.addEventListener('message', e => {
  if (typeof e.data === 'string') {
    if (e.data.startsWith('gotoSlide:')) {
      const target = parseInt(e.data.split(':')[1]);
      if (target >= 1 && target <= total) {
        current = target;
        loadSlide(current);
      }
    }
    if (e.data.startsWith('gotoAnimation:')) {
      const target = parseInt(e.data.split(':')[1]);
      if (target >= 1 && target <= total) {
        animationStack.push(current); // 记录来源页（五层数据流 = 3）
        current = target;
        loadSlide(current);
      }
    }
    if (e.data === 'goBack') {
      goBack();
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / 1920, vh / 1080);
  const offsetX = (1920 * (1 - scale)) / 2;
  const offsetY = (1080 * (1 - scale)) / 2;
  iframe.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
}
window.addEventListener('resize', resize);
window.addEventListener('load', () => { loadSlide(1); resize(); });
</script>
