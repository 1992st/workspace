<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Presentation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
.page { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
.page.active { display: block; }
.page iframe { width: 100%; height: 100%; border: none; }
#indicator { position: fixed; bottom: 20px; right: 30px; color: rgba(255,255,255,0.4); font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; z-index: 100; }
#hint { position: fixed; bottom: 20px; left: 30px; color: rgba(255,255,255,0.3); font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; z-index: 100; }
.page[data-idx="10"] ~ #indicator,
.page[data-idx="10"] ~ #hint { color: rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div class="page active" data-idx="1"><iframe src="01-cover.html"></iframe></div>
<div class="page" data-idx="2"><iframe src="02-overview.html"></iframe></div>
<div class="page" data-idx="3"><iframe src="03-architecture.html"></iframe></div>
<div class="page" data-idx="4"><iframe src="04-prompt-overview.html"></iframe></div>
<div class="page" data-idx="5"><iframe src="05-inject-assemble.html"></iframe></div>
<div class="page" data-idx="6"><iframe src="06-skills.html"></iframe></div>
<div class="page" data-idx="7"><iframe src="07-memory.html"></iframe></div>
<div class="page" data-idx="8"><iframe src="08-optimizations.html"></iframe></div>
<div class="page" data-idx="9"><iframe src="09-p100-case.html"></iframe></div>
<div class="page" data-idx="10"><iframe src="10-summary.html"></iframe></div>

<div id="indicator">1 / 10</div>
<div id="hint">← → 翻页 · F11 全屏</div>

<script>
let current = 1;
const total = 10;
const indicator = document.getElementById('indicator');
const hint = document.getElementById('hint');

function show(n) {
  if (n < 1 || n > total) return;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector('.page[data-idx="' + n + '"]').classList.add('active');
  current = n;
  indicator.textContent = current + ' / ' + total;
  if (current === 10) {
    indicator.style.color = 'rgba(0,0,0,0.4)';
    hint.style.color = 'rgba(0,0,0,0.3)';
  } else {
    indicator.style.color = 'rgba(255,255,255,0.4)';
    hint.style.color = 'rgba(255,255,255,0.3)';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    show(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    show(current - 1);
  } else if (e.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen();
  }
});

document.addEventListener('click', function() {
  show(current + 1);
});
</script>
</body>
</html>
