<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 Cover</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
.slide { width: 1920px; height: 1080px; position: relative; }
.title { position: absolute; left: 80px; top: 340px; font-size: 110px; font-weight: 600; letter-spacing: -3px; }
.subtitle { position: absolute; left: 84px; top: 490px; font-size: 42px; color: #a1a1a6; font-weight: 400; letter-spacing: -0.5px; }
.badge { position: absolute; left: 84px; top: 620px; border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; padding: 14px 28px; font-size: 18px; color: #6e6e73; }
.decor { position: absolute; right: 120px; top: 260px; width: 420px; height: 560px; border: 1px solid rgba(255,255,255,0.06); border-radius: 40px; background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 60%); }
.ring { position: absolute; right: 220px; top: 360px; width: 220px; height: 220px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; }
.ring-inner { position: absolute; right: 280px; top: 420px; width: 100px; height: 100px; border: 1px solid rgba(255,255,255,0.08); border-radius: 50%; }
.dot { position: absolute; right: 320px; top: 460px; width: 20px; height: 20px; background: #2997ff; border-radius: 50%; opacity: 0.9; }
</style>
</head>
<body>
<div class="slide">
  <div class="title">OpenClaw 功能拆解</div>
  <div class="subtitle">从 Prompt 工程到 Agent 上下文管理</div>
  <div class="badge">Engineering Deep Dive</div>
  <div class="decor"></div>
  <div class="ring"></div>
  <div class="ring-inner"></div>
  <div class="dot"></div>
</div>
</body>
</html>
