<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.container {
  width: 1080px;
  padding: 60px 80px;
  background: #ffffff;
}
.title {
  font-size: 48px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 12px;
}
.subtitle {
  font-size: 24px;
  color: #666;
  margin-bottom: 40px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 20px;
}
th {
  background: #1a1a1a;
  color: #fff;
  padding: 18px 20px;
  text-align: left;
  font-weight: 600;
}
td {
  padding: 20px;
  border-bottom: 1px solid #e0e0e0;
  color: #333;
  vertical-align: top;
}
tr:nth-child(even) {
  background: #fafafa;
}
.product-name {
  font-weight: 700;
  font-size: 22px;
  color: #1a1a1a;
}
.pro {
  color: #27ae60;
  font-weight: 600;
}
.con {
  color: #e74c3c;
}
.emoji {
  font-size: 28px;
  margin-right: 8px;
}
.source {
  margin-top: 40px;
  font-size: 18px;
  color: #999;
  text-align: right;
}
</style>
</head>
<body>
<div class="container">
  <div class="title">大厂记忆方案对比</div>
  <div class="subtitle">各家AI产品如何"记住"你？各有长短</div>
  
  <table>
    <tr>
      <th style="width:18%">产品</th>
      <th style="width:22%">记忆方式</th>
      <th style="width:30%">优点</th>
      <th style="width:30%">短板</th>
    </tr>
    <tr>
      <td><span class="emoji">🟣</span><span class="product-name">Claude</span></td>
      <td>主动检测记忆</td>
      <td class="pro">自动识别重要信息保存</td>
      <td class="con">覆盖面有限，只记"明说"的</td>
    </tr>
    <tr>
      <td><span class="emoji">🟢</span><span class="product-name">ChatGPT</span></td>
      <td>混合记忆</td>
      <td class="pro">用户可控+AI自动</td>
      <td class="con">上下文有限，长对话会"失忆"</td>
    </tr>
    <tr>
      <td><span class="emoji">🔵</span><span class="product-name">Gemini</span></td>
      <td>超大上下文窗口</td>
      <td class="pro">百万token，理论容量大</td>
      <td class="con">窗口大≠记得牢，注意力会涣散</td>
    </tr>
    <tr>
      <td><span class="emoji">🟠</span><span class="product-name">OpenClaw</span></td>
      <td>文件存储+搜索</td>
      <td class="pro">透明可控，用户能查看</td>
      <td class="con">本地存储，换设备记忆丢失</td>
    </tr>
    <tr>
      <td><span class="emoji">🔴</span><span class="product-name">国内产品</span></td>
      <td>对话历史保存</td>
      <td class="pro">基本历史记录</td>
      <td class="con">跨会话个性化极不成熟</td>
    </tr>
  </table>
  
  <div class="source">信息来源：各产品官方文档 + 用户实测反馈（2026年4月）</div>
</div>
</body>
</html>
