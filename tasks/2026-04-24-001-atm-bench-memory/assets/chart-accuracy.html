<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; background: #fff; }
.chart-container { width: 600px; margin: 0 auto; }
h2 { text-align: center; color: #333; font-size: 18px; margin-bottom: 30px; }
.bar-group { margin-bottom: 20px; }
.label { font-size: 13px; color: #555; margin-bottom: 6px; }
.bar-wrap { background: #f0f0f0; border-radius: 6px; height: 32px; position: relative; }
.bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 12px; font-size: 13px; font-weight: 600; color: #fff; }
.bar.low { background: #e74c3c; }
.bar.mid { background: #f39c12; }
.bar.high { background: #3498db; }
.value { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 700; color: #333; }
.legend { margin-top: 24px; font-size: 11px; color: #888; text-align: center; }
</style>
</head>
<body>
<div class="chart-container">
<h2>ATM-Bench 记忆准确率测试结果</h2>

<div class="bar-group">
  <div class="label">Codex（困难版）</div>
  <div class="bar-wrap">
    <div class="bar low" style="width:39.7%">39.7%</div>
    <span class="value">39.7%</span>
  </div>
</div>

<div class="bar-group">
  <div class="label">Claude Code + Opus 4.6（困难版）</div>
  <div class="bar-wrap">
    <div class="bar low" style="width:33.8%">33.8%</div>
    <span class="value">33.8%</span>
  </div>
</div>

<div class="bar-group">
  <div class="label">其他专用记忆系统（困难版）</div>
  <div class="bar-wrap">
    <div class="bar low" style="width:18%">&lt;20%</div>
    <span class="value">&lt;20%</span>
  </div>
</div>

<div class="bar-group">
  <div class="label">标准版测试（最佳成绩）</div>
  <div class="bar-wrap">
    <div class="bar mid" style="width:50%">~50%</div>
    <span class="value">~50%</span>
  </div>
</div>

<div class="legend">
  数据来源：剑桥大学ATM-Bench论文（arXiv:2603.01990）| 困难版平均需6.3个记忆片段才能回答
</div>
</div>
</body>
</html>
