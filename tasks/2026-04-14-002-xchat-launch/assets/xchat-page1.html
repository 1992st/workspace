<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f6f8fb; color: #1f2937; width: 1080px; min-height: 1920px; padding: 80px 70px; }
.badge { display: inline-block; background: #1d9bf0; color: #fff; padding: 10px 28px; border-radius: 30px; font-size: 24px; font-weight: 700; margin-bottom: 24px; }
h1 { font-size: 72px; font-weight: 900; margin-bottom: 18px; letter-spacing: -1px; color: #0f172a; }
.subtitle { font-size: 32px; color: #475569; font-weight: 500; margin-bottom: 36px; }
.launch { display: inline-flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e2e8f0; padding: 18px 32px; border-radius: 16px; font-size: 26px; font-weight: 700; color: #1d9bf0; margin-bottom: 60px; }
.section-title { font-size: 34px; font-weight: 700; margin-bottom: 28px; color: #0f172a; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.card { background: #fff; border-radius: 24px; padding: 32px; border: 1px solid #e2e8f0; }
.card-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 18px; background: #eff6ff; }
.card-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; color: #0f172a; }
.card-desc { font-size: 20px; color: #64748b; line-height: 1.6; }
.footer { text-align: center; margin-top: 70px; font-size: 20px; color: #94a3b8; }
.footer .brand { font-size: 24px; font-weight: 700; color: #64748b; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="badge">马斯克新作 · 即将上线</div>
<h1>XChat 是什么？</h1>
<div class="subtitle">马斯克酝酿四年的「西方微信」，终于来了</div>
<div class="launch">🚀 2026年4月17日（周五）· App Store</div>

<div class="section-title">6 大核心功能</div>
<div class="grid">
  <div class="card"><div class="card-icon">🔐</div><div class="card-title">端到端加密</div><div class="card-desc">官方宣称 E2E 加密，无广告、无追踪</div></div>
  <div class="card"><div class="card-icon">🤖</div><div class="card-title">Grok AI 集成</div><div class="card-desc">聊天界面直接调用 AI 完成任务</div></div>
  <div class="card"><div class="card-icon">💣</div><div class="card-title">阅后即焚</div><div class="card-desc">10秒 ~ 1周 自定义时效，查看后自动销毁</div></div>
  <div class="card"><div class="card-icon">🚫</div><div class="card-title">截图拦截</div><div class="card-desc">阻止截图操作，或实时触发截屏提醒</div></div>
  <div class="card"><div class="card-icon">📹</div><div class="card-title">音视频通话</div><div class="card-desc">无需手机号，绑定 X 账号即可使用</div></div>
  <div class="card"><div class="card-icon">📝</div><div class="card-title">灵活消息管理</div><div class="card-desc">双向删除、发出后编辑、群聊、文件共享</div></div>
</div>

<div class="footer">
  <div class="brand">Agent 观察室</div>
  <div>下一页：隐私争议与「西方微信」真相 →</div>
</div>
</body>
</html>
