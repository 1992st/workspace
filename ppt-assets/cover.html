<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  overflow: hidden;
  position: relative;
}
.aurora {
  position: absolute; top: 50%; left: 50%;
  width: 1400px; height: 600px;
  transform: translate(-50%, -60%);
  background: radial-gradient(ellipse at 30% 50%, rgba(59,130,246,0.35) 0%, transparent 55%),
              radial-gradient(ellipse at 70% 40%, rgba(99,102,241,0.28) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(14,165,233,0.22) 0%, transparent 55%);
  filter: blur(80px);
  animation: flow 10s ease-in-out infinite alternate;
}
@keyframes flow {
  0% { transform: translate(-50%, -60%) rotate(0deg) scale(1); opacity: 0.7; }
  100% { transform: translate(-50%, -55%) rotate(8deg) scale(1.08); opacity: 1; }
}
h1 {
  font-size: 140px; font-weight: 200; letter-spacing: -0.02em;
  color: #f5f5f7; z-index: 1;
  text-align: center;
}
h2 {
  font-size: 40px; font-weight: 400; letter-spacing: 0.02em;
  color: #a1a1a6; margin-top: 24px; z-index: 1;
}
.badge {
  position: absolute; bottom: 80px;
  font-size: 18px; font-weight: 500;
  color: #6e6e73; letter-spacing: 0.08em;
  text-transform: uppercase; z-index: 1;
}
</style>
</head>
<body>
<div class="aurora"></div>
<h1>OpenClaw</h1>
<h2>Prompt 注入与上下文管理</h2>
<div class="badge">Engineering Deep Dive</div>
</body>
</html>
