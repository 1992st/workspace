<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #f5f5f7;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  overflow: hidden;
}
.line {
  position: absolute; top: 540px; left: 360px; right: 360px; height: 2px;
  background: linear-gradient(90deg, transparent, #d1d1d6 20%, #d1d1d6 80%, transparent);
}
.node {
  position: absolute; top: 540px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.6);
  border: 2px solid #d1d1d6;
  transform: translate(-50%, -50%);
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  transition: all 0.3s;
}
.node:nth-child(1) { left: 360px; border-color: #3b82f6; background: rgba(59,130,246,0.15); }
.node:nth-child(2) { left: 642px; border-color: #6366f1; background: rgba(99,102,241,0.15); }
.node:nth-child(3) { left: 924px; border-color: #8b5cf6; background: rgba(139,92,246,0.15); }
.node:nth-child(4) { left: 1206px; border-color: #a855f7; background: rgba(168,85,247,0.15); }
.node:nth-child(5) { left: 1488px; border-color: #ec4899; background: rgba(236,72,153,0.15); }
.node:nth-child(6) { left: 1560px; width: 12px; height: 12px; border-color: #d1d1d6; background: #fff; }
.label {
  position: absolute; top: 600px;
  transform: translateX(-50%);
  font-size: 20px; font-weight: 500; color: #1d1d1f; letter-spacing: -0.01em;
}
.label:nth-child(7) { left: 360px; }
.label:nth-child(8) { left: 642px; }
.label:nth-child(9) { left: 924px; }
.label:nth-child(10) { left: 1206px; }
.label:nth-child(11) { left: 1488px; }
</style>
</head>
<body>
<div class="line"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="label">Gateway</div>
<div class="label">Session</div>
<div class="label">Bootstrap</div>
<div class="label">System Prompt</div>
<div class="label">Runtime</div>
</body>
</html>
