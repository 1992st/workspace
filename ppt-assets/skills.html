<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #f5f5f7;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  overflow: hidden;
}
.orb {
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.4));
  box-shadow: 0 20px 60px rgba(0,0,0,0.08), inset 0 0 40px rgba(255,255,255,0.6);
  position: absolute;
}
.parent {
  width: 240px; height: 240px; left: 480px; top: 420px;
  border: 1px solid rgba(0,0,0,0.06);
}
.child {
  width: 140px; height: 140px; left: 1300px; top: 470px;
  border: 1px solid rgba(0,0,0,0.06);
}
.beam {
  position: absolute; top: 540px; left: 720px; width: 580px; height: 2px;
  background: linear-gradient(90deg, rgba(59,130,246,0.4), rgba(99,102,241,0.4));
  transform-origin: left center;
}
.tag {
  position: absolute; top: 510px; left: 950px;
  font-size: 22px; font-weight: 500;
  color: #6366f1; background: rgba(255,255,255,0.8);
  padding: 8px 18px; border-radius: 20px;
  border: 1px solid rgba(99,102,241,0.15);
  backdrop-filter: blur(8px);
}
</style>
</head>
<body>
<div class="orb parent"></div>
<div class="orb child"></div>
<div class="beam"></div>
<div class="tag">&lt;available_skills&gt;</div>
</body>
</html>
