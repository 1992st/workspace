<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  overflow: hidden;
}
.socket {
  width: 360px; height: 220px; border-radius: 28px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 0 60px rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 500; color: rgba(255,255,255,0.9);
  position: relative;
}
.fiber {
  position: absolute; height: 3px; border-radius: 2px;
  transform-origin: left center;
}
.fiber:nth-child(2) {
  width: 320px; left: 50%; top: 50%;
  background: linear-gradient(90deg, rgba(59,130,246,0.8), rgba(59,130,246,0));
  transform: rotate(-35deg);
}
.fiber:nth-child(3) {
  width: 320px; left: 50%; top: 50%;
  background: linear-gradient(90deg, rgba(99,102,241,0.8), rgba(99,102,241,0));
  transform: rotate(0deg);
}
.fiber:nth-child(4) {
  width: 320px; left: 50%; top: 50%;
  background: linear-gradient(90deg, rgba(236,72,153,0.8), rgba(236,72,153,0));
  transform: rotate(35deg);
}
.dot {
  width: 14px; height: 14px; border-radius: 50%;
  position: absolute; top: 50%; left: 50%;
  margin: -7px 0 0 -7px;
}
.dot:nth-child(5) { transform: rotate(-35deg) translateX(300px); background: #3b82f6; box-shadow: 0 0 20px #3b82f6; }
.dot:nth-child(6) { transform: rotate(0deg) translateX(300px); background: #6366f1; box-shadow: 0 0 20px #6366f1; }
.dot:nth-child(7) { transform: rotate(35deg) translateX(300px); background: #ec4899; box-shadow: 0 0 20px #ec4899; }
.label {
  position: absolute; font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.6);
}
.label:nth-child(8) { left: 1240px; top: 340px; }
.label:nth-child(9) { left: 1240px; top: 530px; }
.label:nth-child(10) { left: 1240px; top: 720px; }
</style>
</head>
<body>
<div class="fiber"></div>
<div class="fiber"></div>
<div class="fiber"></div>
<div class="socket">Memory</div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="label">Files</div>
<div class="label">Vector Index</div>
<div class="label">LLM Summary</div>
</body>
</html>
