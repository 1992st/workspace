<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  overflow: hidden;
  perspective: 1200px;
}
.plate {
  width: 720px; height: 180px; border-radius: 24px;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 500; letter-spacing: -0.01em;
  color: rgba(255,255,255,0.92);
  position: absolute;
  left: 50%; transform: translateX(-50%);
  box-shadow: 0 24px 80px rgba(0,0,0,0.35);
}
.top {
  top: 280px;
  background: rgba(59,130,246,0.12);
}
.mid {
  top: 450px;
  background: rgba(245,158,11,0.12);
}
.bot {
  top: 620px;
  background: rgba(168,85,247,0.12);
}
</style>
</head>
<body>
<div class="plate top">硬编码规则 · Safety · Execution Bias · CLI</div>
<div class="plate mid">Project Context · AGENTS · SOUL · MEMORY</div>
<div class="plate bot">环境信息 · Workspace · Runtime · Sandbox</div>
</body>
</html>
