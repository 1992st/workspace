    <script id="skill-model-data" type="application/json">{"skill": {"name": "market-sector-prediction", "description": "Win_Stock × Vibe-Trading 大盘与板块预测 Skill - 受控接入 Vibe-Trading，生成可追溯、可复盘的大盘/板块预测", "path": "/Volumes/zhangstExtern/openclaw/workspace/win_stock/skills/market-sector-prediction", "mode": "script-flow", "flow_source": "semantic_agent", "flow_spec": "/Volumes/zhangstExtern/openclaw/workspace/win_stock/skills/market-sector-prediction/viewer-flow-spec.json"}, "summary": {"responsibility": "受控接入 Vibe-Trading，为 Win_Stock 生成可追溯、可门控、可复盘的大盘与板块预测。", "when_to_use": ["用户要求分析大盘短期或中期走势", "用户要求分析板块轮动、板块阶段、退潮信号或龙头确认", "cron 需要生成盘前、盘中、盘后市场/板块预测", "个股分析需要读取最近有效的大盘/板块环境"], "when_not_to_use": ["用户要求直接执行交易", "用户只要求普通个股行情或财务数据", "Vibe-Trading 不可用且本地数据也不足以形成观察报告"], "core_outputs": ["prediction.health.check 能力探测结果", "大盘/板块预测 JSON", "大盘/板块预测 Markdown 报告", "blocked report", "prediction index.jsonl", "daily-review 可读取并回写状态的预测复盘文件"], "boundaries": ["Vibe-Trading 只提供研究证据，不是事实最终裁判", "Win_Stock 本地事实和质量门控优先", "standard 模式不调用 swarm", "未通过质量门控时不得输出方向性预测"]}, "files": [{"path": "SKILL.md", "type": "skill", "editable": false, "content": "---\nname: market-sector-prediction\ndescription: Win_Stock × Vibe-Trading 大盘与板块预测 Skill - 受控接入 Vibe-Trading，生成可追溯、可复盘的大盘/板块预测\nversion: 1.0\n---\n\n# Market Sector Prediction Skill\n\n## 定位\n\n本 Skill 使用 HKUDS/Vibe-Trading 作为受控研究引擎。Win_Stock 负责事实裁决、质量门控、报告保存、索引、复盘和个股分析上下文注入。\n\nVibe-Trading 只提供研究证据，不直接成为最终预测结论。\n\n## 强制原则\n\n1. 先能力探测，再调用 Vibe 工具。\n2. 只允许调用白名单工具，禁止透传用户指定 tool。\n3. Win_Stock 本地事实优先于 Vibe 文本观点。\n4. 所有正式预测必须保存 JSON、Markdown 和 index。\n5. 数据不足时写 blocked report，不输出方向预测。\n6. 日常 standard 模式不调用 swarm。\n7. deep 模式失败可降级 standard，但必须标注。\n\n## 正式入口\n\n```bash\npython3 skills/stock-skill/scripts/run.py run --skill prediction --action prediction.health.check --input '{}'\npython3 skills/stock-skill/scripts/run.py run --skill prediction --action prediction.market.generate --input '{\"horizon\":\"short\"}'\npython3 skills/stock-skill/scripts/run.py run --skill prediction --action prediction.sector.generate --input '{\"sector\":\"证券\",\"horizon\":\"short\"}'\n```\n\n## 保存路径\n\n```text\ndata/market/predictions/\ndata/sectors/predictions/\ndata/predictions/vibe_runs/\n```\n\n## 禁止事项\n\n- 数据缺失时编造预测\n- Vibe MCP 不可用时假装完成研究\n- 未保存报告就返回结论\n- 使用未登记 Vibe 工具\n- 把 Vibe 观点覆盖 Win_Stock 本地事实\n"}, {"path": "runtime/__init__.py", "type": "script", "editable": false, "content": "\"\"\"Win_Stock market/sector prediction runtime.\"\"\"\n\n"}, {"path": "runtime/blocked_report_writer.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict\n\nfrom index_writer import IndexWriter\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass BlockedReportWriter:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n        self.index = IndexWriter(root)\n\n    def write(self, payload: Dict[str, Any]) -&gt; Dict[str, str]:\n        target_type = payload[\"target_type\"]\n        date = payload[\"trading_date\"]\n        if target_type == \"market\":\n            base = self.root / \"data\" / \"market\" / \"predictions\"\n            stem = f\"{date}_market_blocked\"\n        else:\n            sector = str(payload[\"target\"]).replace(\"/\", \"_\")\n            base = self.root / \"data\" / \"sectors\" / \"predictions\" / sector\n            stem = f\"{date}_blocked\"\n        base.mkdir(parents=True, exist_ok=True)\n        md_path = base / f\"{stem}.md\"\n        json_path = base / f\"{stem}.json\"\n        payload.setdefault(\"artifacts\", {})\n        payload[\"artifacts\"][\"blocked_report_path\"] = str(md_path)\n        payload[\"artifacts\"][\"json_path\"] = str(json_path)\n        payload[\"artifacts\"][\"markdown_path\"] = str(md_path)\n        json_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n        md_path.write_text(self._markdown(payload), encoding=\"utf-8\")\n        self.index.write(\n            {\n                \"date\": date,\n                \"target_type\": target_type,\n                \"target\": payload.get(\"target\"),\n                \"horizon\": payload.get(\"horizon\"),\n                \"mode\": payload.get(\"mode\"),\n                \"status\": \"blocked\",\n                \"confidence\": 0,\n                \"json_path\": str(json_path),\n                \"markdown_path\": str(md_path),\n                \"vibe_run_id\": payload.get(\"engine\", {}).get(\"vibe_run_id\", \"\"),\n                \"review_status\": \"reviewed\",\n            }\n        )\n        return {\"json_path\": str(json_path), \"markdown_path\": str(md_path), \"blocked_report_path\": str(md_path)}\n\n    def _markdown(self, payload: Dict[str, Any]) -&gt; str:\n        quality = payload.get(\"data_quality\", {})\n        return \"\\n\".join(\n            [\n                f\"# {payload.get('target')} 预测阻断报告\",\n                \"\",\n                f\"- 生成时间: {payload.get('generated_at')}\",\n                f\"- 目标: {payload.get('target')}\",\n                f\"- 周期: {payload.get('horizon')}\",\n                \"\",\n                \"## 结论\",\n                \"本次不输出方向预测。\",\n                \"\",\n                \"## 阻断原因\",\n                *[f\"- {item}\" for item in quality.get(\"blocking_reasons\", [])],\n                \"\",\n                \"## 缺失数据\",\n                *[f\"- {item}\" for item in quality.get(\"missing_sections\", [])],\n                \"\",\n                \"## Vibe 可用工具\",\n                json.dumps(payload.get(\"engine\", {}), ensure_ascii=False, indent=2),\n                \"\",\n                \"## 本地数据状态\",\n                json.dumps(payload.get(\"local_snapshot\", {}), ensure_ascii=False, indent=2),\n                \"\",\n                \"## 事实冲突\",\n                json.dumps(payload.get(\"fact_reconciliation\", {}), ensure_ascii=False, indent=2),\n            ]\n        )\n"}, {"path": "runtime/capability_probe.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nimport os\nimport shutil\nimport subprocess\nfrom datetime import datetime, timezone, timedelta\nfrom typing import Any, Dict, List\n\nfrom tool_whitelist import ToolPolicy\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass CapabilityProbe:\n    \"\"\"Probe the real Vibe-Trading MCP surface without assuming tool names.\"\"\"\n\n    def __init__(self, command: str = \"vibe-trading-mcp\", policy: ToolPolicy | None = None) -&gt; None:\n        self.command = command\n        self.policy = policy or ToolPolicy.default()\n\n    def probe(self) -&gt; Dict[str, Any]:\n        env_manifest = os.environ.get(\"WIN_STOCK_VIBE_TOOL_MANIFEST\")\n        if env_manifest:\n            detected = self._parse_manifest(env_manifest)\n            return self._build(True, \"env-manifest\", detected, [])\n\n        command_path = shutil.which(self.command)\n        if not command_path:\n            return self._build(False, \"\", [], [f\"{self.command} not found on PATH\"])\n\n        detected: List[str] = []\n        errors: List[str] = []\n        for args in ([\"--tools-json\"], [\"list-tools\"], [\"--help\"]):\n            try:\n                result = subprocess.run(\n                    [command_path, *args],\n                    capture_output=True,\n                    text=True,\n                    timeout=8,\n                )\n            except Exception as exc:\n                errors.append(f\"{' '.join(args)}: {exc}\")\n                continue\n            text = f\"{result.stdout}\\n{result.stderr}\".strip()\n            parsed = self._parse_manifest(text)\n            if parsed:\n                detected = parsed\n                break\n            if result.returncode != 0:\n                errors.append(f\"{' '.join(args)} exit={result.returncode}\")\n\n        if not detected:\n            return self._build(\n                True,\n                \"installed-but-manifest-unavailable\",\n                [],\n                errors + [\"tool manifest unavailable; prediction tools disabled\"],\n            )\n        return self._build(True, \"detected\", detected, errors)\n\n    def _parse_manifest(self, text: str) -&gt; List[str]:\n        try:\n            payload = json.loads(text)\n        except Exception:\n            payload = None\n        if isinstance(payload, dict):\n            tools = payload.get(\"tools\") or payload.get(\"tools_detected\") or payload.get(\"available_tools\")\n            if isinstance(tools, list):\n                names = []\n                for item in tools:\n                    if isinstance(item, str):\n                        names.append(item)\n                    elif isinstance(item, dict) and item.get(\"name\"):\n                        names.append(str(item[\"name\"]))\n                return sorted(set(names))\n        found = [tool for tool in self.policy.allowed_tools if tool in text]\n        return sorted(set(found))\n\n    def _build(self, available: bool, version: str, detected: List[str], missing: List[str]) -&gt; Dict[str, Any]:\n        enabled = self.policy.enabled_from_manifest(detected)\n        disabled = self.policy.disabled_from_manifest(detected) if detected else sorted(self.policy.allowed_tools)\n        standard = available and \"get_market_data\" in enabled and \"factor_analysis\" in enabled\n        deep = standard and \"run_swarm\" in enabled and \"get_run_result\" in enabled and bool(os.environ.get(\"VIBE_LLM_API_KEY\"))\n        return {\n            \"vibe_available\": available,\n            \"vibe_version\": version,\n            \"tools_detected\": detected,\n            \"tools_enabled\": enabled,\n            \"tools_disabled\": disabled,\n            \"modes_available\": {\"standard\": standard, \"deep\": deep},\n            \"missing_requirements\": missing,\n            \"checked_at\": datetime.now(CN_TZ).isoformat(timespec=\"seconds\"),\n        }\n"}, {"path": "runtime/confidence_policy.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Iterable\n\n\ndef confidence_cap(\n    *,\n    mode: str,\n    complete_data: bool,\n    has_backtest: bool,\n    has_swarm: bool,\n    missing_sections: Iterable[str],\n    taxonomy_conflict: bool = False,\n    local_only: bool = False,\n) -&gt; int:\n    missing = set(missing_sections)\n    if taxonomy_conflict:\n        return 50\n    if local_only:\n        return 45\n    if \"fund_flow\" in missing:\n        return 55\n    if \"market_breadth\" in missing:\n        return 55\n    if \"backtest\" in missing or not has_backtest:\n        return 68\n    if mode == \"deep\" and complete_data and has_swarm and has_backtest:\n        return 82\n    if complete_data:\n        return 72\n    return 55\n"}, {"path": "runtime/evidence_mapper.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Any, Dict\n\n\ndef default_market_evidence(local_snapshot: Dict[str, Any], vibe_results: Dict[str, Any]) -&gt; Dict[str, Any]:\n    breadth = local_snapshot.get(\"market_breadth\") or {}\n    bullish = []\n    bearish = [\"Vibe-Trading 结构化研究结果不可用，不能确认外部研究观点\"]\n    if breadth.get(\"advancers\") and breadth.get(\"decliners\"):\n        bullish.append(f\"市场宽度: 上涨 {breadth.get('advancers')} / 下跌 {breadth.get('decliners')}\")\n    return {\n        \"bullish\": bullish,\n        \"bearish\": bearish,\n        \"neutral\": [],\n        \"capital_flow\": [],\n        \"market_breadth\": [breadth] if breadth else [],\n        \"backtest_summary\": [],\n        \"vibe_opinions\": [],\n        \"next_day_checks\": [\"验证主要指数方向、成交额、市场宽度和资金流是否同步\"],\n    }\n\n\ndef default_sector_evidence(local_snapshot: Dict[str, Any], vibe_results: Dict[str, Any]) -&gt; Dict[str, Any]:\n    return {\n        \"bullish\": [],\n        \"bearish\": [\"Vibe-Trading 板块研究结果不可用，不能确认板块持续性\"],\n        \"neutral\": [],\n        \"capital_flow\": [],\n        \"relative_strength\": [],\n        \"sector_stage\": \"\",\n        \"leaders\": [],\n        \"fade_signals\": [],\n        \"backtest_summary\": [],\n        \"vibe_opinions\": [],\n        \"next_day_checks\": [\"验证板块涨跌、成分股同步率、龙头承接和资金方向\"],\n    }\n"}, {"path": "runtime/fact_reconciliation.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Any, Dict, List\n\n\ndef reconcile_market(local: Dict[str, Any], vibe: Dict[str, Any] | None = None) -&gt; Dict[str, Any]:\n    vibe = vibe or {}\n    conflicts: List[Dict[str, Any]] = []\n    authoritative: List[Dict[str, Any]] = []\n    status = \"ok\"\n\n    local_date = local.get(\"trading_date\")\n    vibe_date = vibe.get(\"trading_date\") or vibe.get(\"date\")\n    if local_date and vibe_date and str(local_date) != str(vibe_date):\n        conflicts.append({\"field\": \"trading_date\", \"local\": local_date, \"vibe\": vibe_date, \"severity\": \"blocked\"})\n        status = \"blocked\"\n\n    if local.get(\"amount_unit_uncertain\"):\n        conflicts.append({\"field\": \"amount\", \"severity\": \"blocked\", \"reason\": \"成交额单位无法确认\"})\n        status = \"blocked\"\n\n    if local.get(\"indices\"):\n        authoritative.append({\"field\": \"indices\", \"source\": \"win_stock_local\", \"value\": local.get(\"indices\")})\n\n    return {\"status\": status, \"conflicts\": conflicts, \"authoritative_values\": authoritative}\n\n\ndef reconcile_sector(local: Dict[str, Any], vibe: Dict[str, Any] | None = None) -&gt; Dict[str, Any]:\n    result = reconcile_market(local, vibe)\n    local_members = set(local.get(\"member_codes\") or [])\n    vibe_members = set((vibe or {}).get(\"member_codes\") or [])\n    if local_members and vibe_members:\n        diff = local_members.symmetric_difference(vibe_members)\n        denominator = max(len(local_members | vibe_members), 1)\n        diff_ratio = len(diff) / denominator\n        if diff_ratio &gt; 0.2:\n            result[\"status\"] = \"degraded\" if result[\"status\"] != \"blocked\" else \"blocked\"\n            result[\"conflicts\"].append(\n                {\n                    \"field\": \"sector_members\",\n                    \"severity\": \"degraded\",\n                    \"reason\": \"板块成分股差异超过20%\",\n                    \"diff_ratio\": round(diff_ratio, 4),\n                }\n            )\n    return result\n"}, {"path": "runtime/index_writer.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom pathlib import Path\nfrom typing import Any, Dict\n\n\nclass IndexWriter:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n\n    def write(self, record: Dict[str, Any]) -&gt; None:\n        target_type = record.get(\"target_type\")\n        if target_type == \"market\":\n            path = self.root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\"\n        elif target_type == \"sector\":\n            path = self.root / \"data\" / \"sectors\" / \"predictions\" / \"index.jsonl\"\n        else:\n            path = self.root / \"data\" / \"predictions\" / \"vibe_runs\" / \"index.jsonl\"\n        path.parent.mkdir(parents=True, exist_ok=True)\n        with path.open(\"a\", encoding=\"utf-8\") as handle:\n            handle.write(json.dumps(record, ensure_ascii=False, sort_keys=True) + \"\\n\")\n\n    def write_vibe_run(self, record: Dict[str, Any]) -&gt; None:\n        payload = {\"target_type\": \"vibe_run\", **record}\n        self.write(payload)\n"}, {"path": "runtime/local_snapshot.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nimport subprocess\nimport sys\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass LocalSnapshotBuilder:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n        self.stock_client = root / \"skills\" / \"stock-data\" / \"scripts\" / \"stock_client.py\"\n        self.fast_data = root / \"skills\" / \"stock-data\" / \"scripts\" / \"fast_data.py\"\n\n    def market(self) -&gt; Dict[str, Any]:\n        result = self._run_stock_client([\"market\"], timeout=90)\n        data = result.get(\"data\") or {}\n        breadth = data.get(\"breadth\") or {}\n        indices = data.get(\"indices\") or []\n        return {\n            \"status\": \"ok\" if result.get(\"success\") and indices else \"degraded\",\n            \"trading_date\": self._latest_date(indices),\n            \"indices\": indices,\n            \"market_breadth\": breadth,\n            \"has_amount\": any(item.get(\"amount\") is not None for item in indices),\n            \"has_breadth\": bool(breadth),\n            \"source\": result.get(\"source\", \"stock_client\"),\n            \"errors\": result.get(\"errors\", []) + ([result.get(\"error\")] if result.get(\"error\") else []),\n        }\n\n    def sector(self, sector: str, taxonomy_payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        heat = self._run_fast_data([\"heat\", sector], timeout=120)\n        heat_data = heat.get(\"data\") or {}\n        members = heat_data.get(\"members\") or []\n        member_codes = [str(item.get(\"code\", \"\")).zfill(6) for item in members if item.get(\"code\")]\n        if taxonomy_payload.get(\"status\") == \"ok\":\n            from sector_taxonomy import SectorTaxonomyResolver\n\n            taxonomy_payload = SectorTaxonomyResolver(self.root).resolve(\n                sector,\n                taxonomy_payload.get(\"sector_taxonomy\"),\n                members=members,\n            )\n        return {\n            \"status\": \"ok\" if taxonomy_payload.get(\"status\") == \"ok\" and members else \"blocked\",\n            \"trading_date\": datetime.now(CN_TZ).strftime(\"%Y-%m-%d\"),\n            \"sector\": sector,\n            \"sector_taxonomy\": taxonomy_payload.get(\"sector_taxonomy\"),\n            \"member_count\": len(members),\n            \"members_snapshot_path\": taxonomy_payload.get(\"members_snapshot_path\"),\n            \"member_codes\": member_codes,\n            \"sector_heat\": heat_data,\n            \"has_sector_quote\": bool(heat.get(\"success\") and heat_data),\n            \"has_members\": bool(members),\n            \"errors\": heat.get(\"errors\", []) + ([heat.get(\"error\")] if heat.get(\"error\") else []),\n        }\n\n    def _run_stock_client(self, args: list[str], timeout: int) -&gt; Dict[str, Any]:\n        try:\n            completed = subprocess.run(\n                [sys.executable, str(self.stock_client), *args],\n                cwd=str(self.root),\n                capture_output=True,\n                text=True,\n                timeout=timeout,\n            )\n            if not completed.stdout.strip():\n                return {\"success\": False, \"error\": completed.stderr.strip() or \"empty stock_client output\"}\n            return json.loads(completed.stdout)\n        except Exception as exc:\n            return {\"success\": False, \"error\": str(exc)}\n\n    def _run_fast_data(self, args: list[str], timeout: int) -&gt; Dict[str, Any]:\n        try:\n            completed = subprocess.run(\n                [sys.executable, str(self.fast_data), *args],\n                cwd=str(self.root),\n                capture_output=True,\n                text=True,\n                timeout=timeout,\n            )\n            if not completed.stdout.strip():\n                return {\"success\": False, \"error\": completed.stderr.strip() or \"empty fast_data output\"}\n            return json.loads(completed.stdout)\n        except Exception as exc:\n            return {\"success\": False, \"error\": str(exc)}\n\n    def _latest_date(self, indices: list[dict[str, Any]]) -&gt; str:\n        dates = [str(item.get(\"date\")) for item in indices if item.get(\"date\")]\n        return max(dates) if dates else datetime.now(CN_TZ).strftime(\"%Y-%m-%d\")\n"}, {"path": "runtime/market_adapter.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict\n\nfrom blocked_report_writer import BlockedReportWriter\nfrom evidence_mapper import default_market_evidence\nfrom fact_reconciliation import reconcile_market\nfrom local_snapshot import LocalSnapshotBuilder\nfrom quality_gate import QualityGate\nfrom report_writer import ReportWriter\nfrom vibe_client import VibeClient\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass MarketPredictionAdapter:\n    def __init__(self, root: Path, vibe: VibeClient | None = None) -&gt; None:\n        self.root = root\n        self.vibe = vibe or VibeClient()\n        self.snapshot = LocalSnapshotBuilder(root)\n        self.gate = QualityGate()\n        self.report_writer = ReportWriter(root)\n        self.blocked_writer = BlockedReportWriter(root)\n\n    def generate(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        horizon = str(payload.get(\"horizon\") or \"short\")\n        mode = str(payload.get(\"mode\") or \"standard\")\n        caps = self.vibe.health_check()\n        local = self.snapshot.market()\n        vibe_results = self._collect_vibe_standard(horizon, mode, caps)\n        reconciliation = reconcile_market(local, vibe_results.get(\"market_data\", {}).get(\"payload\"))\n        evidence = default_market_evidence(local, vibe_results)\n        prediction = self._default_prediction(horizon)\n        quality = self.gate.evaluate(\n            target_type=\"market\",\n            mode=mode,\n            local_snapshot=local,\n            evidence=evidence,\n            prediction=prediction,\n            reconciliation=reconciliation,\n            capabilities=caps,\n        )\n        prediction[\"confidence\"] = min(prediction[\"confidence\"], quality[\"confidence_cap\"])\n        output = self._build_output(horizon, mode, caps, local, reconciliation, quality, prediction, evidence, vibe_results)\n        if quality[\"status\"] == \"blocked\":\n            artifacts = self.blocked_writer.write(output)\n            output[\"artifacts\"].update(artifacts)\n        else:\n            artifacts = self.report_writer.write_prediction(output)\n            output[\"artifacts\"].update(artifacts)\n        return output\n\n    def _collect_vibe_standard(self, horizon: str, mode: str, caps: Dict[str, Any]) -&gt; Dict[str, Any]:\n        if not caps.get(\"vibe_available\"):\n            return {}\n        results: Dict[str, Any] = {}\n        if \"get_market_data\" in caps.get(\"tools_enabled\", []):\n            results[\"market_data\"] = self.vibe.get_market_data({\"market\": \"CN-A\", \"scope\": \"market\", \"horizon\": horizon})\n        if \"factor_analysis\" in caps.get(\"tools_enabled\", []):\n            results[\"factor_analysis\"] = self.vibe.factor_analysis({\"market\": \"CN-A\", \"target\": \"market\", \"horizon\": horizon})\n        if \"pattern_recognition\" in caps.get(\"tools_enabled\", []):\n            results[\"pattern_recognition\"] = self.vibe.pattern_recognition({\"market\": \"CN-A\", \"target\": \"market\", \"horizon\": horizon})\n        if \"backtest\" in caps.get(\"tools_enabled\", []):\n            results[\"backtest\"] = self.vibe.backtest({\"market\": \"CN-A\", \"target\": \"market\", \"horizon\": horizon})\n        if mode == \"deep\" and caps.get(\"modes_available\", {}).get(\"deep\"):\n            results[\"swarm\"] = self.vibe.run_swarm({\"preset\": \"market_committee\", \"market\": \"CN-A\", \"horizon\": horizon})\n        return results\n\n    def _default_prediction(self, horizon: str) -&gt; Dict[str, Any]:\n        return {\n            \"base_case\": \"数据不足，保持观察，不输出强方向判断\",\n            \"probabilities\": {\"up\": 0, \"sideways\": 100, \"down\": 0},\n            \"confidence\": 30,\n            \"position_environment\": \"cash_watch\",\n            \"support\": [],\n            \"resistance\": [],\n            \"trigger_conditions\": [\"Vibe-Trading 工具恢复并完成结构化研究\", \"本地资金和市场宽度数据齐备\"],\n            \"invalidation_conditions\": [\"关键事实与交易日无法对齐\", \"成交额单位无法确认\"],\n        }\n\n    def _build_output(\n        self,\n        horizon: str,\n        mode: str,\n        caps: Dict[str, Any],\n        local: Dict[str, Any],\n        reconciliation: Dict[str, Any],\n        quality: Dict[str, Any],\n        prediction: Dict[str, Any],\n        evidence: Dict[str, Any],\n        vibe_results: Dict[str, Any],\n    ) -&gt; Dict[str, Any]:\n        date = local.get(\"trading_date\") or datetime.now(CN_TZ).strftime(\"%Y-%m-%d\")\n        return {\n            \"schema_version\": \"1.0\",\n            \"target_type\": \"market\",\n            \"target\": \"A股大盘\",\n            \"sector_taxonomy\": None,\n            \"horizon\": horizon,\n            \"mode\": mode,\n            \"trading_date\": date,\n            \"generated_at\": datetime.now(CN_TZ).isoformat(timespec=\"seconds\"),\n            \"engine\": {\n                \"primary\": \"vibe-trading\",\n                \"vibe_version\": caps.get(\"vibe_version\", \"\"),\n                \"vibe_run_id\": \"\",\n                \"tools_used\": sorted(vibe_results.keys()),\n                \"tools_missing\": caps.get(\"tools_disabled\", []),\n            },\n            \"local_snapshot\": local,\n            \"fact_reconciliation\": reconciliation,\n            \"data_quality\": quality,\n            \"prediction\": prediction,\n            \"evidence\": {\n                \"bullish\": evidence.get(\"bullish\", []),\n                \"bearish\": evidence.get(\"bearish\", []),\n                \"neutral\": evidence.get(\"neutral\", []),\n                \"backtest_summary\": evidence.get(\"backtest_summary\", []),\n                \"vibe_opinions\": evidence.get(\"vibe_opinions\", []),\n            },\n            \"review_plan\": {\n                \"direction_threshold\": \"short: +/-0.8%; mid: +/-2.5%\",\n                \"next_day_checks\": evidence.get(\"next_day_checks\", []),\n                \"mid_term_checks\": [\"验证5-20交易日方向和风险触发条件\"] if horizon == \"mid\" else [],\n            },\n            \"artifacts\": {\"json_path\": \"\", \"markdown_path\": \"\", \"blocked_report_path\": None, \"vibe_raw_path\": \"\"},\n        }\n"}, {"path": "runtime/prediction_thresholds.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Literal\n\n\nDirection = Literal[\"up\", \"sideways\", \"down\"]\n\n\ndef market_threshold(horizon: str) -&gt; float:\n    return 2.5 if horizon == \"mid\" else 0.8\n\n\ndef sector_threshold(horizon: str, volatility_20d: float | None = None) -&gt; float:\n    vol = abs(float(volatility_20d or 0.0))\n    if horizon == \"mid\":\n        return max(3.0, vol)\n    return max(1.0, 0.5 * vol)\n\n\ndef classify_return(change_pct: float, threshold: float) -&gt; Direction:\n    if change_pct &gt; threshold:\n        return \"up\"\n    if change_pct &lt; -threshold:\n        return \"down\"\n    return \"sideways\"\n\n\ndef support_resistance_hit(actual: float, level: float, tolerance_pct: float = 0.3) -&gt; bool:\n    if level == 0:\n        return False\n    return abs(actual - level) / abs(level) * 100 &lt;= tolerance_pct\n"}, {"path": "runtime/quality_gate.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nfrom confidence_policy import confidence_cap\n\n\nMARKET_REQUIRED = {\n    \"indices\": \"主要指数数据\",\n    \"amount\": \"成交额/量能\",\n    \"market_breadth\": \"市场宽度或情绪替代指标\",\n    \"fund_flow\": \"至少一个资金维度\",\n    \"probabilities\": \"概率分布\",\n    \"bearish_evidence\": \"反方证据\",\n    \"invalidation_conditions\": \"失效条件\",\n    \"next_day_checks\": \"下一交易日验证点\",\n}\n\nSECTOR_REQUIRED = {\n    \"sector_quote\": \"板块行情\",\n    \"sector_taxonomy\": \"板块 taxonomy\",\n    \"members_snapshot\": \"成分股快照\",\n    \"fund_flow_or_relative_strength\": \"板块资金或相对强弱\",\n    \"sector_stage\": \"板块阶段判断\",\n    \"leaders\": \"龙头/跟风/掉队判断\",\n    \"bearish_evidence\": \"反方证据\",\n    \"fade_signals\": \"退潮信号\",\n    \"next_day_checks\": \"下一交易日验证点\",\n}\n\n\nclass QualityGate:\n    def evaluate(\n        self,\n        *,\n        target_type: str,\n        mode: str,\n        local_snapshot: Dict[str, Any],\n        evidence: Dict[str, Any],\n        prediction: Dict[str, Any],\n        reconciliation: Dict[str, Any],\n        capabilities: Dict[str, Any],\n        taxonomy: Dict[str, Any] | None = None,\n    ) -&gt; Dict[str, Any]:\n        missing: List[str] = []\n        stale: List[str] = []\n        required = MARKET_REQUIRED if target_type == \"market\" else SECTOR_REQUIRED\n\n        vibe_unavailable = not capabilities.get(\"vibe_available\", False)\n        local_insufficient = local_snapshot.get(\"status\") not in {\"ok\", \"degraded\"} or (\n            target_type == \"market\" and not local_snapshot.get(\"indices\")\n        )\n        if vibe_unavailable and local_insufficient:\n            return self._blocked([\"Vibe MCP 不可用且本地数据不足\"], missing, stale, 0)\n\n        if reconciliation.get(\"status\") == \"blocked\":\n            return self._blocked([\"关键事实冲突\"], missing, stale, 0)\n\n        if target_type == \"market\":\n            if not local_snapshot.get(\"indices\"):\n                missing.append(\"indices\")\n            if not local_snapshot.get(\"has_amount\"):\n                missing.append(\"amount\")\n            if not local_snapshot.get(\"has_breadth\"):\n                missing.append(\"market_breadth\")\n            if not evidence.get(\"capital_flow\"):\n                missing.append(\"fund_flow\")\n        else:\n            if not local_snapshot.get(\"has_sector_quote\"):\n                missing.append(\"sector_quote\")\n            if not taxonomy or taxonomy.get(\"status\") != \"ok\":\n                missing.append(\"sector_taxonomy\")\n            if not local_snapshot.get(\"has_members\") or int(local_snapshot.get(\"member_count\") or 0) &lt;= 0:\n                missing.append(\"members_snapshot\")\n            if not evidence.get(\"capital_flow\") and not evidence.get(\"relative_strength\"):\n                missing.append(\"fund_flow_or_relative_strength\")\n            if not evidence.get(\"sector_stage\"):\n                missing.append(\"sector_stage\")\n            if not evidence.get(\"leaders\"):\n                missing.append(\"leaders\")\n            if not evidence.get(\"fade_signals\"):\n                missing.append(\"fade_signals\")\n\n        probabilities = prediction.get(\"probabilities\") or {}\n        if not all(key in probabilities for key in (\"up\", \"sideways\", \"down\")):\n            missing.append(\"probabilities\")\n        if not evidence.get(\"bearish\"):\n            missing.append(\"bearish_evidence\")\n        if not prediction.get(\"invalidation_conditions\"):\n            missing.append(\"invalidation_conditions\")\n        if not evidence.get(\"next_day_checks\"):\n            missing.append(\"next_day_checks\")\n\n        blocked_keys = {\"probabilities\", \"bearish_evidence\", \"invalidation_conditions\"}\n        if target_type == \"sector\":\n            blocked_keys |= {\"sector_taxonomy\", \"members_snapshot\"}\n        if any(key in missing for key in blocked_keys):\n            return self._blocked([required.get(key, key) for key in missing if key in blocked_keys], missing, stale, 0)\n\n        taxonomy_conflict = any(item.get(\"field\") == \"sector_members\" for item in reconciliation.get(\"conflicts\", []))\n        has_backtest = bool(evidence.get(\"backtest_summary\"))\n        has_swarm = bool(evidence.get(\"vibe_opinions\"))\n        cap = confidence_cap(\n            mode=mode,\n            complete_data=not missing,\n            has_backtest=has_backtest,\n            has_swarm=has_swarm,\n            missing_sections=missing,\n            taxonomy_conflict=taxonomy_conflict,\n            local_only=not capabilities.get(\"vibe_available\", False),\n        )\n        status = \"ok\" if not missing and reconciliation.get(\"status\") == \"ok\" else \"degraded\"\n        return {\n            \"status\": status,\n            \"score\": max(0, min(100, 100 - len(missing) * 12 - len(stale) * 5)),\n            \"missing_sections\": missing,\n            \"stale_sections\": stale,\n            \"confidence_cap\": cap,\n            \"blocking_reasons\": [],\n        }\n\n    def _blocked(self, reasons: List[str], missing: List[str], stale: List[str], cap: int) -&gt; Dict[str, Any]:\n        return {\n            \"status\": \"blocked\",\n            \"score\": 0,\n            \"missing_sections\": missing,\n            \"stale_sections\": stale,\n            \"confidence_cap\": cap,\n            \"blocking_reasons\": reasons,\n        }\n"}, {"path": "runtime/report_writer.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict\n\nfrom index_writer import IndexWriter\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass ReportWriter:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n        self.index = IndexWriter(root)\n\n    def write_prediction(self, payload: Dict[str, Any]) -&gt; Dict[str, str]:\n        target_type = payload[\"target_type\"]\n        date = payload[\"trading_date\"]\n        horizon = payload[\"horizon\"]\n        if target_type == \"market\":\n            base = self.root / \"data\" / \"market\" / \"predictions\"\n            stem = f\"{date}_market_{horizon}_prediction\"\n        else:\n            sector = str(payload[\"target\"]).replace(\"/\", \"_\")\n            base = self.root / \"data\" / \"sectors\" / \"predictions\" / sector\n            stem = f\"{date}_{horizon}_prediction\"\n        base.mkdir(parents=True, exist_ok=True)\n        json_path = base / f\"{stem}.json\"\n        md_path = base / f\"{stem}.md\"\n        payload[\"artifacts\"][\"json_path\"] = str(json_path)\n        payload[\"artifacts\"][\"markdown_path\"] = str(md_path)\n        json_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n        md_path.write_text(self._markdown(payload), encoding=\"utf-8\")\n        self.index.write(\n            {\n                \"date\": date,\n                \"target_type\": target_type,\n                \"target\": payload.get(\"target\"),\n                \"horizon\": horizon,\n                \"mode\": payload.get(\"mode\"),\n                \"status\": payload.get(\"data_quality\", {}).get(\"status\"),\n                \"confidence\": payload.get(\"prediction\", {}).get(\"confidence\", 0),\n                \"json_path\": str(json_path),\n                \"markdown_path\": str(md_path),\n                \"vibe_run_id\": payload.get(\"engine\", {}).get(\"vibe_run_id\", \"\"),\n                \"review_status\": \"pending\",\n            }\n        )\n        return {\"json_path\": str(json_path), \"markdown_path\": str(md_path)}\n\n    def _markdown(self, payload: Dict[str, Any]) -&gt; str:\n        prediction = payload.get(\"prediction\", {})\n        probabilities = prediction.get(\"probabilities\", {})\n        evidence = payload.get(\"evidence\", {})\n        return \"\\n\".join(\n            [\n                f\"# {payload.get('target')} {payload.get('horizon')} 预测\",\n                \"\",\n                f\"- 生成时间: {payload.get('generated_at')}\",\n                f\"- 模式: {payload.get('mode')}\",\n                f\"- 状态: {payload.get('data_quality', {}).get('status')}\",\n                f\"- 置信度: {prediction.get('confidence')} / 上限 {payload.get('data_quality', {}).get('confidence_cap')}\",\n                f\"- 方向概率: 上涨 {probabilities.get('up')} / 震荡 {probabilities.get('sideways')} / 下跌 {probabilities.get('down')}\",\n                f\"- 仓位环境: {prediction.get('position_environment')}\",\n                \"\",\n                \"## 主结论\",\n                prediction.get(\"base_case\", \"\"),\n                \"\",\n                \"## 看多证据\",\n                *[f\"- {item}\" for item in evidence.get(\"bullish\", [])],\n                \"\",\n                \"## 看空/反方证据\",\n                *[f\"- {item}\" for item in evidence.get(\"bearish\", [])],\n                \"\",\n                \"## 失效条件\",\n                *[f\"- {item}\" for item in prediction.get(\"invalidation_conditions\", [])],\n                \"\",\n                \"## 下一交易日验证点\",\n                *[f\"- {item}\" for item in payload.get(\"review_plan\", {}).get(\"next_day_checks\", [])],\n                \"\",\n                \"## 数据状态\",\n                json.dumps(payload.get(\"data_quality\", {}), ensure_ascii=False, indent=2),\n            ]\n        )\n\n\ndef now_iso() -&gt; str:\n    return datetime.now(CN_TZ).isoformat(timespec=\"seconds\")\n"}, {"path": "runtime/review_bridge.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict, List\n\nfrom prediction_thresholds import classify_return, market_threshold\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass ReviewBridge:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n\n    def pending_predictions(self) -&gt; List[Dict[str, Any]]:\n        records: List[Dict[str, Any]] = []\n        for path in (\n            self.root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\",\n            self.root / \"data\" / \"sectors\" / \"predictions\" / \"index.jsonl\",\n        ):\n            if not path.exists():\n                continue\n            for line in path.read_text(encoding=\"utf-8\").splitlines():\n                if not line.strip():\n                    continue\n                record = json.loads(line)\n                if record.get(\"review_status\") == \"pending\":\n                    records.append(record)\n        return records\n\n    def build_review_plan(self) -&gt; Dict[str, Any]:\n        reviewed = [self._write_review(record) for record in self.pending_predictions()]\n        self._rewrite_indexes(reviewed)\n        return {\n            \"reviewed\": reviewed,\n            \"reviewed_count\": len(reviewed),\n            \"note\": \"review_bridge writes structural review files and marks index records reviewed\",\n        }\n\n    def _write_review(self, record: Dict[str, Any]) -&gt; Dict[str, Any]:\n        prediction_payload = {}\n        json_path = record.get(\"json_path\")\n        if json_path and Path(json_path).exists():\n            prediction_payload = json.loads(Path(json_path).read_text(encoding=\"utf-8\"))\n        target_type = record.get(\"target_type\")\n        date = record.get(\"date\")\n        direction_threshold = market_threshold(record.get(\"horizon\", \"short\")) if target_type == \"market\" else None\n        review = {\n            \"schema_version\": \"1.0\",\n            \"reviewed_at\": datetime.now(CN_TZ).isoformat(timespec=\"seconds\"),\n            \"date\": date,\n            \"target_type\": target_type,\n            \"target\": record.get(\"target\"),\n            \"horizon\": record.get(\"horizon\"),\n            \"status\": \"blocked_gap_review\" if record.get(\"status\") == \"blocked\" else \"actual_data_pending\",\n            \"direction_threshold\": direction_threshold,\n            \"direction_hit\": None,\n            \"probability_calibration_error\": None,\n            \"support_resistance_hit\": None,\n            \"trigger_matched\": None,\n            \"invalidation_matched\": None,\n            \"error_type\": \"actual_data_pending\",\n            \"lesson\": \"已纳入复盘队列；待接入实际行情验证方向和关键价位。\",\n            \"prediction_artifact\": json_path,\n            \"prediction_quality\": prediction_payload.get(\"data_quality\", {}),\n        }\n        if target_type == \"market\":\n            review_path = self.root / \"data\" / \"market\" / \"reviews\" / f\"{date}_market_prediction_review.json\"\n        else:\n            target = str(record.get(\"target\") or \"unknown\").replace(\"/\", \"_\")\n            review_path = self.root / \"data\" / \"sectors\" / \"reviews\" / target / f\"{date}_prediction_review.json\"\n        review_path.parent.mkdir(parents=True, exist_ok=True)\n        review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n        return {**record, \"review_path\": str(review_path)}\n\n    def _rewrite_indexes(self, reviewed: List[Dict[str, Any]]) -&gt; None:\n        reviewed_keys = {\n            (item.get(\"target_type\"), item.get(\"target\"), item.get(\"date\"), item.get(\"horizon\"), item.get(\"json_path\"))\n            for item in reviewed\n        }\n        for path in (\n            self.root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\",\n            self.root / \"data\" / \"sectors\" / \"predictions\" / \"index.jsonl\",\n        ):\n            if not path.exists():\n                continue\n            records = [json.loads(line) for line in path.read_text(encoding=\"utf-8\").splitlines() if line.strip()]\n            for record in records:\n                key = (record.get(\"target_type\"), record.get(\"target\"), record.get(\"date\"), record.get(\"horizon\"), record.get(\"json_path\"))\n                if key in reviewed_keys:\n                    record[\"review_status\"] = \"reviewed\"\n            path.write_text(\"\\n\".join(json.dumps(record, ensure_ascii=False, sort_keys=True) for record in records) + \"\\n\", encoding=\"utf-8\")\n"}, {"path": "runtime/sector_adapter.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict\n\nfrom blocked_report_writer import BlockedReportWriter\nfrom evidence_mapper import default_sector_evidence\nfrom fact_reconciliation import reconcile_sector\nfrom local_snapshot import LocalSnapshotBuilder\nfrom quality_gate import QualityGate\nfrom report_writer import ReportWriter\nfrom sector_taxonomy import SectorTaxonomyResolver\nfrom vibe_client import VibeClient\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass SectorPredictionAdapter:\n    def __init__(self, root: Path, vibe: VibeClient | None = None) -&gt; None:\n        self.root = root\n        self.vibe = vibe or VibeClient()\n        self.snapshot = LocalSnapshotBuilder(root)\n        self.taxonomy = SectorTaxonomyResolver(root)\n        self.gate = QualityGate()\n        self.report_writer = ReportWriter(root)\n        self.blocked_writer = BlockedReportWriter(root)\n\n    def generate(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        sector = str(payload.get(\"sector\") or payload.get(\"target\") or \"\").strip()\n        if not sector:\n            sector = \"未指定板块\"\n        horizon = str(payload.get(\"horizon\") or \"short\")\n        mode = str(payload.get(\"mode\") or \"standard\")\n        caps = self.vibe.health_check()\n        taxonomy = self.taxonomy.resolve(sector, payload.get(\"sector_taxonomy\"))\n        local = self.snapshot.sector(sector, taxonomy)\n        taxonomy = {\n            **taxonomy,\n            \"members_snapshot_path\": local.get(\"members_snapshot_path\", taxonomy.get(\"members_snapshot_path\")),\n            \"member_count\": local.get(\"member_count\", taxonomy.get(\"member_count\", 0)),\n        }\n        vibe_results = self._collect_vibe_standard(sector, horizon, mode, caps)\n        reconciliation = reconcile_sector(local, vibe_results.get(\"market_data\", {}).get(\"payload\"))\n        evidence = default_sector_evidence(local, vibe_results)\n        prediction = self._default_prediction()\n        quality = self.gate.evaluate(\n            target_type=\"sector\",\n            mode=mode,\n            local_snapshot=local,\n            evidence=evidence,\n            prediction=prediction,\n            reconciliation=reconciliation,\n            capabilities=caps,\n            taxonomy=taxonomy,\n        )\n        prediction[\"confidence\"] = min(prediction[\"confidence\"], quality[\"confidence_cap\"])\n        output = self._build_output(sector, horizon, mode, caps, taxonomy, local, reconciliation, quality, prediction, evidence, vibe_results)\n        if quality[\"status\"] == \"blocked\":\n            artifacts = self.blocked_writer.write(output)\n            output[\"artifacts\"].update(artifacts)\n        else:\n            artifacts = self.report_writer.write_prediction(output)\n            output[\"artifacts\"].update(artifacts)\n        return output\n\n    def _collect_vibe_standard(self, sector: str, horizon: str, mode: str, caps: Dict[str, Any]) -&gt; Dict[str, Any]:\n        if not caps.get(\"vibe_available\"):\n            return {}\n        results: Dict[str, Any] = {}\n        if \"get_market_data\" in caps.get(\"tools_enabled\", []):\n            results[\"market_data\"] = self.vibe.get_market_data({\"market\": \"CN-A\", \"scope\": \"sector\", \"sector\": sector, \"horizon\": horizon})\n        if \"factor_analysis\" in caps.get(\"tools_enabled\", []):\n            results[\"factor_analysis\"] = self.vibe.factor_analysis({\"market\": \"CN-A\", \"target\": sector, \"horizon\": horizon})\n        if \"pattern_recognition\" in caps.get(\"tools_enabled\", []):\n            results[\"pattern_recognition\"] = self.vibe.pattern_recognition({\"market\": \"CN-A\", \"target\": sector, \"horizon\": horizon})\n        if \"backtest\" in caps.get(\"tools_enabled\", []):\n            results[\"backtest\"] = self.vibe.backtest({\"market\": \"CN-A\", \"target\": sector, \"horizon\": horizon})\n        if mode == \"deep\" and caps.get(\"modes_available\", {}).get(\"deep\"):\n            results[\"swarm\"] = self.vibe.run_swarm({\"preset\": \"sector_committee\", \"market\": \"CN-A\", \"sector\": sector, \"horizon\": horizon})\n        return results\n\n    def _default_prediction(self) -&gt; Dict[str, Any]:\n        return {\n            \"base_case\": \"板块研究证据不足，保持观察，不输出强方向判断\",\n            \"probabilities\": {\"up\": 0, \"sideways\": 100, \"down\": 0},\n            \"confidence\": 25,\n            \"position_environment\": \"cash_watch\",\n            \"support\": [],\n            \"resistance\": [],\n            \"trigger_conditions\": [\"Vibe-Trading 板块工具恢复\", \"成分股、资金、龙头证据齐备\"],\n            \"invalidation_conditions\": [\"板块 taxonomy 或成分股快照缺失\", \"关键事实无法对齐\"],\n        }\n\n    def _build_output(\n        self,\n        sector: str,\n        horizon: str,\n        mode: str,\n        caps: Dict[str, Any],\n        taxonomy: Dict[str, Any],\n        local: Dict[str, Any],\n        reconciliation: Dict[str, Any],\n        quality: Dict[str, Any],\n        prediction: Dict[str, Any],\n        evidence: Dict[str, Any],\n        vibe_results: Dict[str, Any],\n    ) -&gt; Dict[str, Any]:\n        date = local.get(\"trading_date\") or datetime.now(CN_TZ).strftime(\"%Y-%m-%d\")\n        return {\n            \"schema_version\": \"1.0\",\n            \"target_type\": \"sector\",\n            \"target\": sector,\n            \"sector_taxonomy\": taxonomy,\n            \"horizon\": horizon,\n            \"mode\": mode,\n            \"trading_date\": date,\n            \"generated_at\": datetime.now(CN_TZ).isoformat(timespec=\"seconds\"),\n            \"engine\": {\n                \"primary\": \"vibe-trading\",\n                \"vibe_version\": caps.get(\"vibe_version\", \"\"),\n                \"vibe_run_id\": \"\",\n                \"tools_used\": sorted(vibe_results.keys()),\n                \"tools_missing\": caps.get(\"tools_disabled\", []),\n            },\n            \"local_snapshot\": local,\n            \"fact_reconciliation\": reconciliation,\n            \"data_quality\": quality,\n            \"prediction\": prediction,\n            \"evidence\": {\n                \"bullish\": evidence.get(\"bullish\", []),\n                \"bearish\": evidence.get(\"bearish\", []),\n                \"neutral\": evidence.get(\"neutral\", []),\n                \"backtest_summary\": evidence.get(\"backtest_summary\", []),\n                \"vibe_opinions\": evidence.get(\"vibe_opinions\", []),\n            },\n            \"sector_state\": {\n                \"stage\": evidence.get(\"sector_stage\", \"\"),\n                \"role\": \"\",\n                \"leaders\": evidence.get(\"leaders\", []),\n                \"followers\": [],\n                \"laggards\": [],\n                \"synchronization_rate\": 0,\n                \"capital_persistence\": \"\",\n                \"catalyst_freshness\": \"\",\n            },\n            \"review_plan\": {\n                \"direction_threshold\": \"short: max(1.0%, 0.5*vol20); mid: max(3.0%, vol20)\",\n                \"next_day_checks\": evidence.get(\"next_day_checks\", []),\n                \"mid_term_checks\": [\"验证5-20交易日板块方向、龙头和退潮信号\"] if horizon == \"mid\" else [],\n            },\n            \"artifacts\": {\"json_path\": \"\", \"markdown_path\": \"\", \"blocked_report_path\": None, \"vibe_raw_path\": \"\"},\n        }\n"}, {"path": "runtime/sector_taxonomy.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict, List\n\n\nCN_TZ = timezone(timedelta(hours=8))\nSUPPORTED_TAXONOMIES = {\"eastmoney_industry\", \"eastmoney_concept\", \"shenwan_industry\", \"custom_watchlist_sector\"}\n\n\nclass SectorTaxonomyResolver:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n\n    def resolve(self, sector: str, taxonomy: str | None = None, members: List[Dict[str, Any]] | None = None) -&gt; Dict[str, Any]:\n        sector_name = str(sector or \"\").replace(\"板块\", \"\").strip()\n        selected = taxonomy or \"eastmoney_industry\"\n        if selected not in SUPPORTED_TAXONOMIES:\n            return {\n                \"status\": \"blocked\",\n                \"reason\": f\"unsupported sector taxonomy: {selected}\",\n                \"sector_name\": sector_name,\n                \"sector_taxonomy\": selected,\n            }\n        snapshot_members = members or []\n        date = datetime.now(CN_TZ).strftime(\"%Y-%m-%d\")\n        path = self.root / \"data\" / \"sectors\" / \"snapshots\" / sector_name / f\"{date}_members.json\"\n        path.parent.mkdir(parents=True, exist_ok=True)\n        payload = {\n            \"sector_name\": sector_name,\n            \"sector_taxonomy\": selected,\n            \"sector_id\": f\"{selected}:{sector_name}\",\n            \"member_count\": len(snapshot_members),\n            \"members\": snapshot_members,\n            \"generated_at\": datetime.now(CN_TZ).isoformat(timespec=\"seconds\"),\n        }\n        path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n        return {\n            \"status\": \"ok\",\n            \"sector_name\": sector_name,\n            \"sector_taxonomy\": selected,\n            \"sector_id\": payload[\"sector_id\"],\n            \"members_snapshot_path\": str(path),\n            \"member_count\": len(snapshot_members),\n        }\n"}, {"path": "runtime/stock_context_bridge.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nfrom typing import Any, Dict, Optional\n\n\nCN_TZ = timezone(timedelta(hours=8))\n\n\nclass StockContextBridge:\n    def __init__(self, root: Path) -&gt; None:\n        self.root = root\n\n    def latest_market_prediction(self) -&gt; Optional[Dict[str, Any]]:\n        return self._latest_from_index(self.root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\")\n\n    def latest_sector_prediction(self, sector: str) -&gt; Optional[Dict[str, Any]]:\n        index_path = self.root / \"data\" / \"sectors\" / \"predictions\" / \"index.jsonl\"\n        return self._latest_from_index(index_path, target=sector)\n\n    def build_context(self, sector: str | None = None) -&gt; Dict[str, Any]:\n        return {\n            \"market_prediction\": self.latest_market_prediction(),\n            \"sector_prediction\": self.latest_sector_prediction(sector) if sector else None,\n            \"freshness_rule\": \"盘中2小时、盘前盘后至下一交易日开盘、中期5交易日\",\n        }\n\n    def _latest_from_index(self, path: Path, target: str | None = None) -&gt; Optional[Dict[str, Any]]:\n        if not path.exists():\n            return None\n        records = [json.loads(line) for line in path.read_text(encoding=\"utf-8\").splitlines() if line.strip()]\n        if target:\n            records = [record for record in records if record.get(\"target\") == target]\n        records = [record for record in records if record.get(\"status\") in {\"ok\", \"degraded\"} and self._is_fresh(record)]\n        if not records:\n            return None\n        latest = records[-1]\n        json_path = latest.get(\"json_path\")\n        if json_path and Path(json_path).exists():\n            return json.loads(Path(json_path).read_text(encoding=\"utf-8\"))\n        return latest\n\n    def _is_fresh(self, record: Dict[str, Any]) -&gt; bool:\n        horizon = record.get(\"horizon\")\n        date_text = str(record.get(\"date\") or \"\")\n        if not date_text:\n            return False\n        try:\n            record_date = datetime.fromisoformat(date_text)\n        except ValueError:\n            try:\n                record_date = datetime.strptime(date_text, \"%Y-%m-%d\").replace(tzinfo=CN_TZ)\n            except ValueError:\n                return False\n        now = datetime.now(CN_TZ)\n        if horizon == \"mid\":\n            return now - record_date &lt;= timedelta(days=7)\n        return now.date() == record_date.date() or now - record_date &lt;= timedelta(days=1)\n"}, {"path": "runtime/tool_whitelist.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Iterable, List\n\n\nALLOWED_TOOLS = {\n    \"get_market_data\",\n    \"factor_analysis\",\n    \"backtest\",\n    \"pattern_recognition\",\n    \"run_swarm\",\n    \"get_swarm_status\",\n    \"get_run_result\",\n    \"list_runs\",\n    \"web_search\",\n    \"read_url\",\n}\n\nFORBIDDEN_TOOLS = {\"write_file\", \"execute_code\", \"shell\"}\n\n\n@dataclass(frozen=True)\nclass ToolPolicy:\n    allowed_tools: set[str]\n\n    @classmethod\n    def default(cls) -&gt; \"ToolPolicy\":\n        return cls(allowed_tools=set(ALLOWED_TOOLS))\n\n    def validate(self, tool_name: str) -&gt; None:\n        if tool_name in FORBIDDEN_TOOLS or tool_name not in self.allowed_tools:\n            raise ValueError(f\"Vibe tool is not allowed: {tool_name}\")\n\n    def enabled_from_manifest(self, detected: Iterable[str]) -&gt; List[str]:\n        return sorted(tool for tool in detected if tool in self.allowed_tools)\n\n    def disabled_from_manifest(self, detected: Iterable[str]) -&gt; List[str]:\n        detected_set = set(detected)\n        missing = self.allowed_tools - detected_set\n        forbidden_detected = detected_set &amp; FORBIDDEN_TOOLS\n        return sorted(missing | forbidden_detected)\n"}, {"path": "runtime/vibe_client.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nfrom typing import Any, Dict\n\nfrom capability_probe import CapabilityProbe\nfrom tool_whitelist import ToolPolicy\n\n\nclass VibeClient:\n    \"\"\"Controlled Vibe-Trading client.\n\n    This adapter intentionally does not expose arbitrary MCP tools. Real MCP\n    invocation can be wired behind call_tool once the manifest is available.\n    \"\"\"\n\n    def __init__(self, probe: CapabilityProbe | None = None, policy: ToolPolicy | None = None) -&gt; None:\n        self.policy = policy or ToolPolicy.default()\n        self.probe_runner = probe or CapabilityProbe(policy=self.policy)\n        self._capabilities: Dict[str, Any] | None = None\n\n    def health_check(self) -&gt; Dict[str, Any]:\n        self._capabilities = self.probe_runner.probe()\n        return self._capabilities\n\n    @property\n    def capabilities(self) -&gt; Dict[str, Any]:\n        if self._capabilities is None:\n            return self.health_check()\n        return self._capabilities\n\n    def call_tool(self, tool_name: str, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        self.policy.validate(tool_name)\n        caps = self.capabilities\n        if tool_name not in caps.get(\"tools_enabled\", []):\n            return {\n                \"status\": \"error\",\n                \"tool\": tool_name,\n                \"error\": f\"tool not enabled by Vibe manifest: {tool_name}\",\n                \"payload\": {},\n            }\n        return {\n            \"status\": \"error\",\n            \"tool\": tool_name,\n            \"error\": \"MCP invocation backend is not configured; tool call blocked safely\",\n            \"payload\": {},\n        }\n\n    def get_market_data(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        return self.call_tool(\"get_market_data\", payload)\n\n    def factor_analysis(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        return self.call_tool(\"factor_analysis\", payload)\n\n    def pattern_recognition(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        return self.call_tool(\"pattern_recognition\", payload)\n\n    def backtest(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        return self.call_tool(\"backtest\", payload)\n\n    def run_swarm(self, payload: Dict[str, Any]) -&gt; Dict[str, Any]:\n        return self.call_tool(\"run_swarm\", payload)\n"}, {"path": "tests/test_prediction_runtime.py", "type": "script", "editable": false, "content": "from __future__ import annotations\n\nimport json\nimport sys\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[3]\nPRED_RUNTIME = ROOT / \"skills\" / \"market-sector-prediction\" / \"runtime\"\nSTOCK_RUNTIME = ROOT / \"skills\" / \"stock-skill\" / \"skill_runtime\"\nfor path in (PRED_RUNTIME, STOCK_RUNTIME):\n    if str(path) not in sys.path:\n        sys.path.insert(0, str(path))\n\nfrom fact_reconciliation import reconcile_market\nfrom prediction_skill import PredictionSkill\nfrom prediction_thresholds import classify_return, market_threshold, sector_threshold, support_resistance_hit\nfrom quality_gate import QualityGate\nfrom tool_whitelist import ToolPolicy\n\n\nclass PredictionRuntimeTests(unittest.TestCase):\n    def test_tool_whitelist_blocks_forbidden_tools(self):\n        policy = ToolPolicy.default()\n        with self.assertRaises(ValueError):\n            policy.validate(\"write_file\")\n        with self.assertRaises(ValueError):\n            policy.validate(\"unknown_tool\")\n        policy.validate(\"get_market_data\")\n\n    def test_fact_reconciliation_blocks_trading_date_conflict(self):\n        result = reconcile_market({\"trading_date\": \"2026-05-25\"}, {\"trading_date\": \"2026-05-24\"})\n        self.assertEqual(result[\"status\"], \"blocked\")\n\n    def test_prediction_thresholds(self):\n        self.assertEqual(market_threshold(\"short\"), 0.8)\n        self.assertEqual(sector_threshold(\"short\", 1.2), 1.0)\n        self.assertEqual(classify_return(1.2, 0.8), \"up\")\n        self.assertTrue(support_resistance_hit(100.2, 100.0))\n\n    def test_quality_gate_blocks_missing_probability(self):\n        gate = QualityGate()\n        result = gate.evaluate(\n            target_type=\"market\",\n            mode=\"standard\",\n            local_snapshot={\"indices\": [{\"code\": \"000001\"}], \"has_amount\": True, \"has_breadth\": True},\n            evidence={\"capital_flow\": [1], \"bearish\": [\"risk\"], \"next_day_checks\": [\"check\"]},\n            prediction={\"probabilities\": {}, \"invalidation_conditions\": [\"invalid\"]},\n            reconciliation={\"status\": \"ok\", \"conflicts\": []},\n            capabilities={\"vibe_available\": True},\n        )\n        self.assertEqual(result[\"status\"], \"blocked\")\n\n    def test_quality_gate_blocks_empty_sector_members(self):\n        gate = QualityGate()\n        result = gate.evaluate(\n            target_type=\"sector\",\n            mode=\"standard\",\n            local_snapshot={\n                \"has_sector_quote\": True,\n                \"has_members\": True,\n                \"member_count\": 0,\n            },\n            evidence={\n                \"capital_flow\": [1],\n                \"sector_stage\": \"start\",\n                \"leaders\": [\"601211\"],\n                \"fade_signals\": [\"跌破板块5日线\"],\n                \"bearish\": [\"risk\"],\n                \"next_day_checks\": [\"check\"],\n            },\n            prediction={\"probabilities\": {\"up\": 1, \"sideways\": 98, \"down\": 1}, \"invalidation_conditions\": [\"invalid\"]},\n            reconciliation={\"status\": \"ok\", \"conflicts\": []},\n            capabilities={\"vibe_available\": True},\n            taxonomy={\"status\": \"ok\"},\n        )\n        self.assertEqual(result[\"status\"], \"blocked\")\n        self.assertIn(\"members_snapshot\", result[\"missing_sections\"])\n\n    def test_prediction_skill_health_contract(self):\n        skill = PredictionSkill(root=ROOT)\n        result = skill.run({\"action\": \"prediction.health.check\"})\n        self.assertIn(result.status, {\"ok\", \"degraded\"})\n        data = result.data[\"data\"]\n        self.assertIn(\"tools_detected\", data)\n        self.assertIn(\"modes_available\", data)\n\n    def test_market_prediction_writes_blocked_report_without_vibe(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            stock_client = root / \"skills\" / \"stock-data\" / \"scripts\"\n            stock_client.mkdir(parents=True)\n            (stock_client / \"stock_client.py\").write_text(\n                \"import json\\nprint(json.dumps({'success': False, 'error': 'no data'}))\\n\",\n                encoding=\"utf-8\",\n            )\n            skill = PredictionSkill(root=root)\n            result = skill.run({\"action\": \"prediction.market.generate\", \"horizon\": \"short\"})\n            self.assertEqual(result.status, \"degraded\")\n            payload = result.data[\"data\"]\n            self.assertEqual(payload[\"data_quality\"][\"status\"], \"blocked\")\n            self.assertTrue(Path(payload[\"artifacts\"][\"blocked_report_path\"]).exists())\n            self.assertTrue((root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\").exists())\n\n    def test_review_update_writes_review_and_marks_index(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            index = root / \"data\" / \"market\" / \"predictions\" / \"index.jsonl\"\n            prediction = root / \"data\" / \"market\" / \"predictions\" / \"2026-05-25_market_short_prediction.json\"\n            prediction.parent.mkdir(parents=True)\n            prediction.write_text(json.dumps({\"data_quality\": {\"status\": \"degraded\"}}, ensure_ascii=False), encoding=\"utf-8\")\n            index.write_text(\n                json.dumps(\n                    {\n                        \"date\": \"2026-05-25\",\n                        \"target_type\": \"market\",\n                        \"target\": \"A股大盘\",\n                        \"horizon\": \"short\",\n                        \"mode\": \"standard\",\n
