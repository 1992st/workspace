<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 800px;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex;
}
.half {
  width: 600px;
  height: 800px;
  padding: 60px 50px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.left {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #fff;
}
.right {
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  color: #212529;
}
.header {
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 16px;
}
.title {
  font-size: 42px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 24px;
}
.subtitle {
  font-size: 18px;
  line-height: 1.6;
  opacity: 0.85;
}
.visual {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.brain-ring {
  width: 320px;
  height: 320px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.15);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brain-core {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
  box-shadow: 0 0 60px rgba(255,107,107,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
}
.orbit {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.2);
  animation: spin 20s linear infinite;
}
.dot {
  position: absolute;
  width: 12px;
  height: 12px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(255,255,255,0.8);
}
.dot1 { top: 10px; left: 50%; transform: translateX(-50%); }
.dot2 { bottom: 10px; left: 50%; transform: translateX(-50%); }
.dot3 { left: 10px; top: 50%; transform: translateY(-50%); }

.grid-system {
  width: 320px;
  height: 320px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 4px;
}
.cell {
  border-radius: 4px;
}
.c1 { background: #495057; }
.c2 { background: #adb5bd; }
.c3 { background: #dee2e6; }
.c4 { background: #339af0; }
.c5 { background: #51cf66; }
.c6 { background: #ff922b; }

.footer {
  border-top: 1px solid;
  padding-top: 24px;
}
.left .footer { border-color: rgba(255,255,255,0.15); }
.right .footer { border-color: rgba(0,0,0,0.1); }
.keyword {
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 8px;
  opacity: 0.6;
}
.value {
  font-size: 20px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="half left">
  <div>
    <div class="header">Claude Code</div>
    <div class="title">反思派</div>
    <div class="subtitle">让 LLM 自己当图书管理员。<br>fork 子代理 → 四阶段反思 → 合并去重修枝。</div>
  </div>
  <div class="visual">
    <div class="brain-ring">
      <div class="orbit"></div>
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="brain-core">🧠</div>
    </div>
  </div>
  <div class="footer">
    <div class="keyword">核心特征</div>
    <div class="value">LLM-as-Janitor · 语义理解 · 无固定分数</div>
  </div>
</div>
<div class="half right">
  <div>
    <div class="header">OpenClaw</div>
    <div class="title">算法派</div>
    <div class="subtitle">把搜索行为全部量化。<br>六维评分 + 阈值门控 → 算法决定晋升。</div>
  </div>
  <div class="visual">
    <div class="grid-system">
      <div class="cell c1"></div><div class="cell c2"></div><div class="cell c3"></div><div class="cell c4"></div><div class="cell c2"></div><div class="cell c1"></div>
      <div class="cell c2"></div><div class="cell c4"></div><div class="cell c5"></div><div class="cell c6"></div><div class="cell c4"></div><div class="cell c2"></div>
      <div class="cell c3"></div><div class="cell c5"></div><div class="cell c1"></div><div class="cell c2"></div><div class="cell c5"></div><div class="cell c3"></div>
      <div class="cell c4"></div><div class="cell c6"></div><div class="cell c2"></div><div class="cell c3"></div><div class="cell c6"></div><div class="cell c4"></div>
      <div class="cell c2"></div><div class="cell c4"></div><div class="cell c5"></div><div class="cell c6"></div><div class="cell c4"></div><div class="cell c2"></div>
      <div class="cell c1"></div><div class="cell c2"></div><div class="cell c3"></div><div class="cell c4"></div><div class="cell c2"></div><div class="cell c1"></div>
    </div>
  </div>
  <div class="footer">
    <div class="keyword">核心特征</div>
    <div class="value">Algorithm-as-Gatekeeper · JSON Store · 0.75/3/2 阈值</div>
  </div>
</div>
</body>
</html>
