<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .frame {
        fill: #ffffff;
        stroke: #d9dde5;
        stroke-width: 2;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #1f2937;
      }
    </style>
  </defs>
  <rect class="frame" x="1" y="1" width="1198" height="778" rx="16"/>
  <text class="title" x="24" y="42">ms-role-compare</text>
  <foreignObject x="16" y="56" width="1168" height="708">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <!-- diagram:size 1200x780 -->
<div style="padding:8px 4px;color:#111827;">
  <div style="font-size:28px;font-weight:700;margin-bottom:14px;">三家公司在 AI 价值链中的角色</div>
  <div style="font-size:16px;color:#6b7280;margin-bottom:20px;">OpenAI 与 Google 更靠近“规则定义者”，微软更偏“整合分发者”</div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
    <div style="border:2px solid #60a5fa;background:#eff6ff;border-radius:12px;padding:14px;">
      <div style="font-size:20px;font-weight:700;color:#1d4ed8;">OpenAI</div>
      <div style="margin-top:10px;font-size:15px;line-height:1.6;">
        <div>模型：自研 GPT</div>
        <div>产品：ChatGPT</div>
        <div>定位：垂直整合、定义交互范式</div>
      </div>
    </div>

    <div style="border:2px solid #4ade80;background:#f0fdf4;border-radius:12px;padding:14px;">
      <div style="font-size:20px;font-weight:700;color:#166534;">Google</div>
      <div style="margin-top:10px;font-size:15px;line-height:1.6;">
        <div>芯片：TPU（多代迭代）</div>
        <div>模型：Gemini</div>
        <div>定位：全栈自研、端到端控制</div>
      </div>
    </div>

    <div style="border:2px solid #f59e0b;background:#fffbeb;border-radius:12px;padding:14px;">
      <div style="font-size:20px;font-weight:700;color:#92400e;">Microsoft</div>
      <div style="margin-top:10px;font-size:15px;line-height:1.6;">
        <div>芯片：主要依赖外部</div>
        <div>模型：深度绑定 OpenAI</div>
        <div>定位：企业分发与平台整合</div>
      </div>
    </div>
  </div>

  <div style="margin-top:18px;display:flex;gap:10px;align-items:center;">
    <div style="padding:8px 10px;background:#dbeafe;border-radius:8px;font-size:14px;">规则定义能力：OpenAI / Google 较强</div>
    <div style="padding:8px 10px;background:#ffedd5;border-radius:8px;font-size:14px;">商业落地能力：Microsoft 较强</div>
  </div>
</div>
    </div>
  </foreignObject>
</svg>
