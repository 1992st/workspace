<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .frame {
        fill: #ffffff;
        stroke: #d9dde5;
        stroke-width: 2;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #1f2937;
      }
    </style>
  </defs>
  <rect class="frame" x="1" y="1" width="1198" height="758" rx="16"/>
  <text class="title" x="24" y="42">ms-three-layer</text>
  <foreignObject x="16" y="56" width="1168" height="688">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <!-- diagram:size 1200x760 -->
<div style="padding:8px 4px;color:#111827;">
  <div style="font-size:28px;font-weight:700;margin-bottom:14px;">微软 AI 三层结构（倒金字塔）</div>
  <div style="font-size:16px;color:#6b7280;margin-bottom:20px;">越往下越重资产，核心技术自主性反而越弱</div>

  <div style="margin:0 auto;width:86%;display:flex;flex-direction:column;gap:14px;">
    <div style="padding:18px 20px;background:#eff6ff;border:2px solid #93c5fd;border-radius:12px;">
      <div style="font-size:22px;font-weight:700;color:#1d4ed8;">应用层（最轻）</div>
      <div style="font-size:16px;line-height:1.6;margin-top:8px;">
        GitHub Copilot 成功；M365 Copilot、Bing AI 表现弱。
      </div>
    </div>

    <div style="padding:18px 20px;background:#f0fdf4;border:2px solid #86efac;border-radius:12px;">
      <div style="font-size:22px;font-weight:700;color:#166534;">平台层（中）</div>
      <div style="font-size:16px;line-height:1.6;margin-top:8px;">
        Azure AI Foundry 做“模型超市”：整合 GPT、Claude、Llama 等多模型。
      </div>
    </div>

    <div style="padding:18px 20px;background:#fff7ed;border:2px solid #fdba74;border-radius:12px;">
      <div style="font-size:22px;font-weight:700;color:#9a3412;">基础设施层（最重）</div>
      <div style="font-size:16px;line-height:1.6;margin-top:8px;">
        数据中心投入巨大；GPU 依赖英伟达，自研 Maia 进度滞后。
      </div>
    </div>
  </div>

  <div style="margin-top:20px;padding:14px 16px;background:#f9fafb;border:1px dashed #d1d5db;border-radius:10px;font-size:15px;">
    观察：微软能赚钱，但“主角能力”不足，结构上更像高阶渠道整合方。
  </div>
</div>
    </div>
  </foreignObject>
</svg>
