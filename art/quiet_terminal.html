<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Terminal</title>
  <style>
    :root {
      color-scheme: dark;
      --dark: #05070a;
      --wall: #111a22;
      --desk: #332115;
      --wood: #6b4123;
      --glow: #8fe7cf;
      --glow-soft: rgba(143, 231, 207, 0.22);
      --amber: #e5b96f;
      --amber-soft: rgba(229, 185, 111, 0.22);
      --paper: #d9d5c7;
      --ink: #1c2529;
      --blue: #7198c5;
      --red: #c45f5f;
      --green: #75be91;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 62% 38%, rgba(143, 231, 207, 0.11), transparent 30%),
        radial-gradient(circle at 29% 21%, rgba(229, 185, 111, 0.1), transparent 26%),
        linear-gradient(180deg, #030407, var(--wall) 56%, #090b0f);
    }

    .scene {
      position: relative;
      width: min(96vw, 1240px);
      height: min(86vh, 820px);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 84px 84px,
        linear-gradient(180deg, rgba(255,255,255,0.028) 1px, transparent 1px) 0 0 / 84px 84px,
        linear-gradient(180deg, #101923 0%, #0b1017 68%, #09080a 100%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 44px 110px rgba(0,0,0,0.58), inset 0 0 0 12px rgba(255,255,255,0.02);
    }

    .desk {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: -4%;
      height: 35%;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04), transparent 30%, rgba(255,255,255,0.03)),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.2) 0 2px, transparent 2px 140px),
        linear-gradient(180deg, var(--wood), var(--desk));
      transform: perspective(900px) rotateX(5deg);
      transform-origin: bottom;
      box-shadow: inset 0 22px 30px rgba(255,255,255,0.035), 0 -20px 50px rgba(0,0,0,0.42);
    }

    .terminal {
      position: absolute;
      left: 24%;
      top: 18%;
      width: 48%;
      height: 38%;
      background:
        radial-gradient(circle at 50% 50%, rgba(143,231,207,0.08), transparent 60%),
        repeating-linear-gradient(180deg, rgba(143,231,207,0.06) 0 2px, transparent 2px 10px),
        #061216;
      border: 10px solid #111b22;
      box-shadow:
        0 0 70px var(--glow-soft),
        inset 0 0 34px rgba(143,231,207,0.16),
        0 26px 44px rgba(0,0,0,0.4);
    }

    .terminal::before {
      content: "";
      position: absolute;
      inset: 8%;
      background:
        linear-gradient(var(--glow), var(--glow)) 0 0 / 56% 2px no-repeat,
        linear-gradient(var(--glow), var(--glow)) 0 18% / 42% 2px no-repeat,
        linear-gradient(var(--glow), var(--glow)) 0 36% / 66% 2px no-repeat,
        linear-gradient(var(--glow), var(--glow)) 0 54% / 34% 2px no-repeat,
        linear-gradient(var(--glow), var(--glow)) 0 72% / 51% 2px no-repeat,
        linear-gradient(var(--glow), var(--glow)) 0 90% / 12% 2px no-repeat;
      opacity: 0.76;
    }

    .terminal::after {
      content: "";
      position: absolute;
      right: 8%;
      bottom: 10%;
      width: 27%;
      height: 44%;
      background:
        linear-gradient(180deg, transparent 0 12%, var(--green) 12% 100%) 0 0 / 18% 100% no-repeat,
        linear-gradient(180deg, transparent 0 38%, var(--blue) 38% 100%) 28% 0 / 18% 100% no-repeat,
        linear-gradient(180deg, transparent 0 23%, var(--red) 23% 100%) 56% 0 / 18% 100% no-repeat,
        linear-gradient(180deg, transparent 0 8%, var(--green) 8% 100%) 84% 0 / 18% 100% no-repeat;
      opacity: 0.82;
    }

    .stand {
      position: absolute;
      left: 45.5%;
      top: 56%;
      width: 9%;
      height: 13%;
      background: linear-gradient(90deg, #101820, #28343c, #101820);
      clip-path: polygon(38% 0, 62% 0, 78% 100%, 22% 100%);
    }

    .keyboard {
      position: absolute;
      left: 31%;
      bottom: 17%;
      width: 34%;
      height: 8%;
      background: linear-gradient(180deg, #26343c, #121b22);
      transform: perspective(450px) rotateX(18deg);
      border-radius: 8px;
      box-shadow: 0 18px 24px rgba(0,0,0,0.32);
    }

    .keyboard::before {
      content: "";
      position: absolute;
      inset: 20% 8%;
      background:
        repeating-linear-gradient(90deg, rgba(220,232,229,0.28) 0 14px, transparent 14px 24px),
        repeating-linear-gradient(180deg, transparent 0 12px, rgba(220,232,229,0.18) 12px 14px, transparent 14px 23px);
      opacity: 0.5;
    }

    .lamp {
      position: absolute;
      right: 12%;
      top: 12%;
      width: 18%;
      height: 54%;
    }

    .lamp .shade {
      position: absolute;
      left: 14%;
      top: 0;
      width: 72%;
      height: 25%;
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, #f0d083, #9d6531);
      box-shadow: 0 0 100px 32px var(--amber-soft);
    }

    .lamp .stem {
      position: absolute;
      left: 48%;
      top: 24%;
      width: 5%;
      height: 55%;
      background: linear-gradient(90deg, #4d311e, #c18442, #4d311e);
    }

    .lamp .base {
      position: absolute;
      left: 27%;
      bottom: 0;
      width: 46%;
      height: 11%;
      border-radius: 50% 50% 12px 12px;
      background: linear-gradient(180deg, #c18442, #4d311e);
      box-shadow: 0 18px 26px rgba(0,0,0,0.34);
    }

    .paper {
      position: absolute;
      left: 10%;
      bottom: 17%;
      width: 21%;
      height: 24%;
      background: linear-gradient(150deg, #ede9d8, var(--paper));
      transform: rotate(-8deg);
      box-shadow: 0 18px 24px rgba(0,0,0,0.28);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 14% 11%;
      background:
        linear-gradient(var(--ink), var(--ink)) 0 0 / 76% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 0 22% / 54% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 0 44% / 82% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 0 66% / 39% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 0 88% / 64% 1px no-repeat;
      opacity: 0.48;
    }

    .pen {
      position: absolute;
      left: 24%;
      bottom: 23%;
      width: 20%;
      height: 1.2%;
      background: linear-gradient(90deg, #1b2024, #9ec6bd 52%, #1b2024);
      transform: rotate(-22deg);
      border-radius: 99px;
      box-shadow: 0 9px 12px rgba(0,0,0,0.28);
    }

    .window {
      position: absolute;
      left: 8%;
      top: 9%;
      width: 18%;
      height: 31%;
      border: 7px solid #182530;
      background:
        radial-gradient(circle at 78% 19%, #dbe3db 0 3px, transparent 4px),
        radial-gradient(circle at 22% 36%, rgba(219,227,219,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 58% 62%, rgba(219,227,219,0.6) 0 1px, transparent 2px),
        linear-gradient(180deg, #07111d, #102739);
      box-shadow: inset 0 0 28px rgba(255,255,255,0.06);
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: rgba(220,232,232,0.34);
    }

    .window::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
    }

    .window::after {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
    }

    .plant {
      position: absolute;
      right: 4%;
      bottom: 15%;
      width: 13%;
      height: 25%;
    }

    .pot {
      position: absolute;
      left: 29%;
      bottom: 0;
      width: 42%;
      height: 32%;
      background: linear-gradient(90deg, #41281e, #7c4a2a);
      clip-path: polygon(10% 0, 90% 0, 72% 100%, 28% 100%);
    }

    .leaf {
      position: absolute;
      left: 48%;
      bottom: 27%;
      width: 14%;
      height: 60%;
      border-radius: 100% 0 100% 0;
      background: #497861;
      transform-origin: bottom center;
    }

    .leaf:nth-child(1) { transform: rotate(-47deg); }
    .leaf:nth-child(2) { transform: rotate(-19deg); height: 74%; background: #5b9573; }
    .leaf:nth-child(3) { transform: rotate(19deg); height: 70%; }
    .leaf:nth-child(4) { transform: rotate(47deg); background: #3e6755; }

    .cursor {
      position: absolute;
      left: 33%;
      top: 47%;
      width: 10px;
      height: 24px;
      background: var(--glow);
      box-shadow: 0 0 18px var(--glow-soft);
      animation: blink 1.2s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 760px) {
      .scene {
        width: 100vw;
        height: 100vh;
        border: 0;
      }

      .terminal {
        left: 9%;
        top: 21%;
        width: 72%;
        height: 32%;
      }

      .stand {
        left: 42%;
        top: 53%;
        width: 15%;
      }

      .keyboard {
        left: 16%;
        width: 58%;
      }

      .lamp {
        right: -4%;
        top: 10%;
        width: 30%;
      }

      .window {
        left: 7%;
        top: 7%;
        width: 28%;
        height: 20%;
      }

      .paper {
        left: 8%;
        width: 34%;
      }

      .plant {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Quiet terminal at night">
    <div class="window"></div>
    <div class="desk"></div>
    <section class="terminal" aria-hidden="true"><div class="cursor"></div></section>
    <div class="stand" aria-hidden="true"></div>
    <div class="keyboard" aria-hidden="true"></div>
    <div class="paper" aria-hidden="true"></div>
    <div class="pen" aria-hidden="true"></div>
    <div class="lamp" aria-hidden="true">
      <div class="shade"></div>
      <div class="stem"></div>
      <div class="base"></div>
    </div>
    <div class="plant" aria-hidden="true">
      <i class="leaf"></i>
      <i class="leaf"></i>
      <i class="leaf"></i>
      <i class="leaf"></i>
      <div class="pot"></div>
    </div>
  </main>
</body>
</html>
